<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kapitel 1 Lektion 1</title>
</head>
<body>
  <script src="http://koda.nu/simple.js">

var color = {
    red: 1,
    green: 1,
    blue: 1
 }

var player = { 
  x: 0, 
  y: 0, 
  size: 40, 
  color: mixColor(color.red,color.green,color.blue),
  speedX: 25, // hastigeten åt höger och vänster
  speedY: 25, // hastigheten upp och ner
  directionX: 1 ,
  directionY: 1,
}

var enemy = { 
  x: 0, 
  y: 0, 
  bred: 400, 
  hojd: 300,
  color: "red",
  speedX: 1, // hastigeten åt höger och vänster
  speedY: 1, // hastigheten upp och ner
  directionX: 1 ,
  directionY: 1,
}
function update() {


if (keyboard.space) 
clearScreen();


//circle(player.x, player.y, player.size, player.color);



 player.x = player.x + player.speedX * player.directionX;
 player.y = player.y + player.speedY * player.directionY;
 
 if (player.x >totalWidth) {
 player.x = 0;
 //player.y = 0;

 }
 if (player.y > totalHeight) {
 player.y = 0;
 //player.x = 0;
}

rectangle(enemy.x, enemy.y, enemy.bred, enemy.hojd, enemy.color);

 enemy.x = enemy.x + enemy.speedX * enemy.directionX;
 enemy.y = enemy.y + enemy.speedY * enemy.directionY;
 
 if (enemy.x >totalWidth) {
 enemy.x = 0;
 //enemy.y = 0;

 }
 if (enemy.y > totalHeight) {
 enemy.y = 0;
 //enemy.x = 0;
}

}





  </script>
</body>
</html>

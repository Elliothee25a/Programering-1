<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZZmall: Zombie Outbreak</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #008080;
      font-family: "MS Sans Serif", Tahoma, Arial, sans-serif;
      display: grid;
      place-items: center;
    }
    #window {
      width: min(960px, calc(100vw - 24px));
      height: min(680px, calc(100vh - 24px));
      border: 2px solid;
      border-color: #dfdfdf #303030 #303030 #dfdfdf;
      background: #c0c0c0;
      box-shadow: 5px 5px 0 rgba(0,0,0,.35);
      padding: 3px;
      display: grid;
      grid-template-rows: 30px 1fr;
    }
    #titlebar {
      background: #000080;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 5px;
      font-weight: bold;
      font-size: 14px;
      user-select: none;
    }
    #buttons { display: flex; gap: 3px; }
    .winbutton {
      width: 22px; height: 20px;
      background: #c0c0c0; color: black;
      border: 2px solid;
      border-color: white #404040 #404040 white;
      text-align: center; line-height: 16px;
      font-weight: bold; font-size: 12px;
    }
    #gamewrap {
      position: relative;
      margin-top: 3px;
      border: 2px solid;
      border-color: #404040 #fff #fff #404040;
      background: #6e7650;
      overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  </style>
</head>
<body>
  <div id="window">
    <div id="titlebar">
      <span>ZZMALL.EXE - Zombie Outbreak</span>
      <div id="buttons"><span class="winbutton">_</span><span class="winbutton">X</span></div>
    </div>
    <div id="gamewrap"><canvas id="game"></canvas></div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const wrap = document.getElementById("gamewrap");

    let w = 0, h = 0, running = true, last = 0, score = 0, wave = 1;
    let mouse = { x: 0, y: 0, down: false };
    const keys = {};

    const player = { x: 0, y: 0, r: 10, hp: 100, speed: 170, angle: 0, fire: 0, inv: 0 };
    let zombies = [];
    let bullets = [];
    let particles = [];
    let pickups = [];

    function resize() {
      const rect = wrap.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = rect.width;
      h = rect.height;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (!player.x) { player.x = w / 2; player.y = h / 2; }
    }

    function worldFromScreen(screenX, screenY) {
      const rect = canvas.getBoundingClientRect();
      return { x: (screenX - rect.left) * w / rect.width, y: (screenY - rect.top) * h / rect.height };
    }

    function spawnZombie() {
      const side = Math.floor(Math.random() * 4);
      let x, y;
      if (side === 0) { x = Math.random() * w; y = -25; }
      if (side === 1) { x = w + 25; y = Math.random() * h; }
      if (side === 2) { x = Math.random() * w; y = h + 25; }
      if (side === 3) { x = -25; y = Math.random() * h; }
      zombies.push({ x, y, r: 11 + Math.random() * 5, hp: 2 + Math.floor(wave / 3), speed: 48 + Math.random() * 24 + wave * 2, phase: Math.random() * 6 });
    }

    function reset() {
      score = 0; wave = 1; running = true;
      player.x = w / 2; player.y = h / 2; player.hp = 100;
      zombies = []; bullets = []; particles = []; pickups = [];
      for (let i = 0; i < 8; i++) spawnZombie();
      last = performance.now();
    }

    function iso(x, y) {
      return { x: w / 2 + (x - y) * 0.82, y: h * 0.18 + (x + y) * 0.41 };
    }

    window.addEventListener("resize", resize);
    window.addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; if (e.key === "Enter" && !running) reset(); });
    window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
    canvas.addEventListener("mousemove", e => mouse = { ...worldFromScreen(e.clientX, e.clientY), down: mouse.down });
    canvas.addEventListener("mousedown", e => { mouse.down = true; mouse = { ...worldFromScreen(e.clientX, e.clientY), down: true }; });
    window.addEventListener("mouseup", () => mouse.down = false);

    function fire() {
      if (player.fire > 0) return;
      const dx = mouse.x - player.x, dy = mouse.y - player.y;
      const len = Math.hypot(dx, dy) || 1;
      bullets.push({ x: player.x + dx / len * 18, y: player.y + dy / len * 18, vx: dx / len * 520, vy: dy / len * 520, life: 1 });
      player.fire = 0.12;
    }

    function update(dt) {
      if (!running) return;
      player.fire -= dt; player.inv -= dt;
      let dx = 0, dy = 0;
      if (keys.w || keys.arrowup) dy--;
      if (keys.s || keys.arrowdown) dy++;
      if (keys.a || keys.arrowleft) dx--;
      if (keys.d || keys.arrowright) dx++;
      const len = Math.hypot(dx, dy);
      if (len) { player.x += dx / len * player.speed * dt; player.y += dy / len * player.speed * dt; }
      player.x = Math.max(18, Math.min(w - 18, player.x));
      player.y = Math.max(18, Math.min(h - 18, player.y));
      player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
      if (mouse.down) fire();

      for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; }
      bullets = bullets.filter(b => b.life > 0 && b.x > -20 && b.x < w + 20 && b.y > -20 && b.y < h + 20);

      for (const z of zombies) {
        const zx = player.x - z.x, zy = player.y - z.y;
        const zl = Math.hypot(zx, zy) || 1;
        z.x += zx / zl * z.speed * dt;
        z.y += zy / zl * z.speed * dt;
        z.phase += dt * 5;
        if (Math.hypot(player.x - z.x, player.y - z.y) < z.r + player.r && player.inv <= 0) {
          player.hp -= 10; player.inv = 0.8;
          if (player.hp <= 0) running = false;
        }
      }

      for (const b of bullets) {
        for (const z of zombies) {
          if (Math.hypot(b.x - z.x, b.y - z.y) < z.r) {
            z.hp--; b.life = 0;
            for (let i = 0; i < 5; i++) particles.push({ x: z.x, y: z.y, vx: (Math.random() - .5) * 90, vy: (Math.random() - .5) * 90, life: .35 });
          }
        }
      }
      const dead = zombies.filter(z => z.hp <= 0);
      for (const z of dead) {
        score += 100;
        if (Math.random() < .12) pickups.push({ x: z.x, y: z.y, type: Math.random() < .6 ? "med" : "ammo", life: 12 });
      }
      zombies = zombies.filter(z => z.hp > 0);

      for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
      particles = particles.filter(p => p.life > 0);
      for (const p of pickups) {
        p.life -= dt;
        if (Math.hypot(p.x - player.x, p.y - player.y) < 24) {
          if (p.type === "med") player.hp = Math.min(100, player.hp + 25);
          else score += 250;
          p.life = 0;
        }
      }
      pickups = pickups.filter(p => p.life > 0);

      const wantedCount = 8 + wave * 2;
      if (zombies.length < wantedCount && Math.random() < dt * (0.8 + wave * .12)) spawnZombie();
      if (score >= wave * 1500) { wave++; player.hp = Math.min(100, player.hp + 15); }
    }

    function drawTile(x, y, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x, y - 12); ctx.lineTo(x + 24, y); ctx.lineTo(x, y + 12); ctx.lineTo(x - 24, y); ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "rgba(25,35,20,.22)";
      ctx.stroke();
    }

    function drawWorld() {
      ctx.fillStyle = "#7b8058";
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#686e49";
      ctx.fillRect(0, h * .72, w, h * .28);
      for (let gy = -4; gy < h / 22 + 8; gy++) {
        for (let gx = -8; gx < w / 24 + 8; gx++) {
          const sx = gx * 48 + (gy & 1) * 24;
          const sy = gy * 24 + 30;
          if (sx > -30 && sx < w + 30 && sy > -20 && sy < h + 20) drawTile(sx, sy, ((gx + gy) & 1) ? "#81875d" : "#777d53");
        }
      }

      ctx.fillStyle = "#9a8d70";
      ctx.fillRect(w * .08, h * .12, w * .84, 12);
      ctx.fillStyle = "#4d4d45";
      ctx.fillRect(w * .08, h * .12 - 2, w * .84, 4);
      ctx.fillStyle = "#6b674f";
      ctx.fillRect(w * .08, h * .12 + 12, w * .84, h * .07);
    }

    function drawZombie(z) {
      ctx.save();
      ctx.translate(z.x, z.y);
      ctx.rotate(Math.sin(z.phase) * .08);
      ctx.fillStyle = "rgba(0,0,0,.28)";
      ctx.beginPath(); ctx.ellipse(0, 9, z.r, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#42552f";
      ctx.fillRect(-z.r * .65, -z.r * .15, z.r * 1.3, z.r * 1.05);
      ctx.fillStyle = "#6c8152";
      ctx.fillRect(-z.r * .55, -z.r * 1.05, z.r * 1.1, z.r * .95);
      ctx.fillStyle = "#9db26f";
      ctx.fillRect(-z.r * .45, -z.r * 1.28, z.r * .9, z.r * .48);
      ctx.fillStyle = "#d44";
      ctx.fillRect(-z.r * .24, -z.r * 1.12, 3, 3); ctx.fillRect(z.r * .12, -z.r * 1.12, 3, 3);
      ctx.restore();
    }

    function drawPlayer() {
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.fillStyle = "rgba(0,0,0,.32)";
      ctx.beginPath(); ctx.ellipse(0, 10, 13, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.rotate(player.angle);
      ctx.fillStyle = "#26334e";
      ctx.fillRect(-7, -8, 14, 20);
      ctx.fillStyle = "#e4c6a1";
      ctx.fillRect(-6, -15, 12, 10);
      ctx.fillStyle = "#202020";
      ctx.fillRect(4, -3, 18, 5);
      ctx.fillStyle = "#c0c0c0";
      ctx.fillRect(7, -2, 13, 3);
      ctx.restore();
    }

    function draw() {
      drawWorld();
      for (const p of pickups) {
        ctx.fillStyle = p.type === "med" ? "#e8e8e8" : "#d7b84b";
        ctx.fillRect(p.x - 7, p.y - 7, 14, 14);
        ctx.fillStyle = p.type === "med" ? "#c00" : "#222";
        ctx.fillRect(p.x - 2, p.y - 5, 4, 10); ctx.fillRect(p.x - 5, p.y - 2, 10, 4);
      }
      const actors = [{ y: player.y, draw: drawPlayer }, ...zombies.map(z => ({ y: z.y, draw: () => drawZombie(z) }))].sort((a, b) => a.y - b.y);
      for (const actor of actors) actor.draw();
      ctx.fillStyle = "#e9df59";
      for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 2, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = "#bb2525";
      for (const p of particles) { ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }

      ctx.fillStyle = "#c0c0c0";
      ctx.fillRect(8, 8, 310, 48);
      ctx.strokeStyle = "#404040"; ctx.strokeRect(8, 8, 310, 48);
      ctx.fillStyle = "#000";
      ctx.font = "bold 14px MS Sans Serif";
      ctx.fillText("SCORE: " + String(score).padStart(6, "0") + "   WAVE " + wave, 18, 28);
      ctx.fillText("HEALTH", 18, 47);
      ctx.fillStyle = "#808080"; ctx.fillRect(77, 38, 202, 11);
      ctx.fillStyle = player.hp > 35 ? "#20a020" : "#c02020";
      ctx.fillRect(79, 40, 198 * Math.max(0, player.hp) / 100, 7);

      if (!running) {
        ctx.fillStyle = "rgba(0,0,0,.62)";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#c0c0c0";
        ctx.fillRect(w / 2 - 165, h / 2 - 62, 330, 124);
        ctx.strokeStyle = "#fff"; ctx.strokeRect(w / 2 - 163, h / 2 - 60, 326, 120);
        ctx.fillStyle = "#000080"; ctx.fillRect(w / 2 - 159, h / 2 - 56, 318, 24);
        ctx.fillStyle = "#fff"; ctx.font = "bold 16px MS Sans Serif";
        ctx.fillText("SYSTEM: INFECTED", w / 2 - 82, h / 2 - 39);
        ctx.fillStyle = "#000"; ctx.font = "bold 22px MS Sans Serif";
        ctx.fillText("GAME OVER", w / 2 - 62, h / 2 + 2);
        ctx.font = "14px MS Sans Serif";
        ctx.fillText("Press ENTER to reboot", w / 2 - 77, h / 2 + 29);
      }
    }

    function loop(t) {
      const dt = Math.min((t - last) / 1000 || 0, .033);
      last = t;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    resize();
    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>

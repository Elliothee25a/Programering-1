<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>läskigt</title>
</head>
<body>
  <!-- simple.js ger spelet funktioner för grafik, tangentbord och uppdateringar. -->
  <script src="http://koda.nu/simple.js">
// Spelet kör update() 60 gånger per sekund.
updatesPerSecond = 60;

// Spelarens position i spelvärlden och spelarens utseende.
var player = {
    x: 0,       // Världens x-koordinat (vänster/höger).
    y: 0,       // Världens y-koordinat (upp/ner).
    size: 15,   // Cirkelns storlek.
    color: "blue",
    speed: 4    // Hur många pixlar spelaren rör sig per bildruta.
};

// Avståndet mellan träden i det osynliga rutnätet.
var treeSpacing = 240;

// Ritar ett träd med en stam och flera cirklar som trädkrona.
function drawTree(x, y, size) {
    rectangle(x - 5, y + size * 0.2, 10, size * 1.5, "#654321");
    circle(x + 3, y - 2, size + 2, "#24532e");
    circle(x, y - 5, size, "#347d43");
    circle(x - size / 3, y - 10, size / 2, "#438e4e");
}

// Körs om och om igen för att läsa av kontroller och rita spelet.
function update() {
    // Rörelseriktningen börjar som stillastående.
    var moveX = 0;
    var moveY = 0;

    // WASD ändrar rörelseriktningen.
    if (keyboard.a) moveX -= 1;
    if (keyboard.d) moveX += 1;
    if (keyboard.w) moveY -= 1;
    if (keyboard.s) moveY += 1;

    // Minska diagonala rörelser så att de inte går snabbare än raka rörelser.
    if (moveX !== 0 && moveY !== 0) {
        moveX *= 0.707;
        moveY *= 0.707;
    }

    // Flytta spelaren i spelvärlden.
    player.x += moveX * player.speed;
    player.y += moveY * player.speed;

    // Rensa föregående bildruta och måla marken.
    clearScreen();
    rectangle(0, 0, totalWidth, totalHeight, "#4f7942");

    // Räkna ut mitten av skärmen, där spelaren alltid ska synas.
    var centerX = totalWidth / 2;
    var centerY = totalHeight / 2;

    // Räkna ut vilka rutnätsrutor som kan synas på skärmen.
    var firstTreeX = Math.floor((player.x - centerX) / treeSpacing) - 1;
    var lastTreeX = Math.ceil((player.x + centerX) / treeSpacing) + 1;
    var firstTreeY = Math.floor((player.y - centerY) / treeSpacing) - 1;
    var lastTreeY = Math.ceil((player.y + centerY) / treeSpacing) + 1;

    // Gå igenom rutorna i området runt spelaren.
    for (var gridX = firstTreeX; gridX <= lastTreeX; gridX++) {
        for (var gridY = firstTreeY; gridY <= lastTreeY; gridY++) {
            // Skapa ett fast värde för varje ruta så träden inte slumpas om varje bildruta.
            var seed = Math.abs((gridX * 37 + gridY * 71) % 11);

            // Hoppa över vissa rutor så att träden står glesare.
            if (seed % 3 !== 0) {
                // Räkna ut trädets fasta position i spelvärlden och dess storlek.
                var treeX = gridX * treeSpacing + seed * 5 - 25;
                var treeY = gridY * treeSpacing + Math.abs((gridX * 97 + gridY * 23) % 70) - 35;
                var size = 22 + Math.abs((gridX * 13 + gridY * 31) % 12);

                // Omvandla världens position till skärmens position.
                // När spelaren rör sig flyttas träden på skärmen åt motsatt håll.
                var screenX = centerX + treeX - player.x;
                var screenY = centerY + treeY - player.y;

                // Rita trädet på den uträknade skärmpositionen.
                drawTree(screenX, screenY, size);
            }
        }
    }

    // Rita spelaren i mitten medan världen rör sig runt den.
    circle(centerX, centerY, player.size, player.color);

    // Visa spelarens position i världen och en instruktion.
    text(30, 30, 20, "Position: " + Math.floor(player.x) + ", " + Math.floor(player.y), "white");
    text(30, 60, 20, "WASD för att röra dig", "white");
}
  </script>
</body>
</html>

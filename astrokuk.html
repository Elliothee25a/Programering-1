<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>AstroRunner</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    canvas {
      display: block;
      background: linear-gradient(to bottom, #000010, #001030);
    }
  </style>
</head>
<body>
    <script src="http://koda.nu/simple.js">
        var player = {
  x: 50,
  y: 300,
  width: 10,
  height: 40,
  velocityY: 0,
  jumpForce: -28,
  gravity: 10,
  onGround: true,
  color: "lime"
};
updatesPerSecond = 144

var obstacles = [];
var obstacleTimer = 0;
var obstacleInterval = 90;
var score = 1;
var gameOver = false;

function drawPlayer() {
  rectangle(player.x, player.y, player.width, player.height, player.color);
}

function updatePlayer() {
  if (keyboard.space && player.onGround) {
    player.velocityY = player.jumpForce;
    player.onGround = false;
  }

  player.velocityY = player.velocityY + player.gravity;
  player.y = player.y + player.velocityY;

  if (player.y + player.height >= totalHeight) {
    player.y = totalHeight - player.height;
    player.velocityY = 0;
    player.onGround = true;
  }
}

function spawnObstacle() {
  if (obstacleTimer <= 0) {
    obstacles.push({
      x: totalWidth,
      y: totalHeight - 900,  
      width: 300,
      height: 600,
      speed: 80
    });
    obstacleTimer = obstacleInterval;
  } else {
    obstacleTimer = obstacleTimer - 1;
  }
}

function updateObstacles() {
  for (var i = obstacles.length -1  ; i >= 0; i--) {
    var obs = obstacles[i];
    obs.x = obs.x - obs.speed;
    rectangle(obs.x, obs.y, obs.width, obs.height, "red");

    if (obs.x + obs.width < 0) {
      obstacles.splice(i, 1);
      score = score + 1;
    }

    if (
      player.x < obs.x + obs.width &&
      player.x + player.width > obs.x &&
      player.y < obs.y + obs.height &&
      player.y + player.height > obs.y
    ) {
      gameOver = true;
    }
  }
}

function drawScore() {
  text(10, 30, 20, "Poäng: " + score, "white");
}

function update() {
  clearScreen();
  rectangle(0, 0, totalWidth, totalHeight, "#000010");

  drawPlayer();
  updatePlayer();
  spawnObstacle();
  updateObstacles();
  drawScore();

  if (gameOver) {
    text(totalWidth / 2 - 150, totalHeight / 2, 40, "GAME OVER - Poäng: " + score, "red");
    stopUpdate();
  }
}
    </script>

<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>snoppong</title>
</head>
<body>
  <script src="http://koda.nu/simple.js">

updatesPerSecond = 144  

var scene = {
    x:0,
    y:0,



}
var player = {
    x: totalWidth /2, 
    y: totalHeight /2, 
    size: 15, 
    color: "Black", 
    speed: 5,

}
//===================================================
function update() {

    clearScreen()
//    hideMouse()

//scene
text(20,60,40,"scene.x " + scene.x,"red")
text(20,200,40,"scene.y " + scene.y,"red")


//player
circle(
    player.x, 
    player.y, 
    player.size, 
    player.color);

//gun bitch
line(mouse.x, mouse.y, player.x, player.y, 5, "red")



//movement till player
if (keyboard.d) 
player.x += player.speed; 
//
if (keyboard.a) 
player.x -= player.speed; 
//
if (keyboard.w) 
player.y -= player.speed; 
//
if (keyboard.s) 
player.y += player.speed; 
//
if (keyboard.a && keyboard.w) 
player.x += player.speed/4, player.y += player.speed/4
//
if (keyboard.a && keyboard.s) 
player.x += player.speed/4, player.y -= player.speed/4
//
if (keyboard.d && keyboard.w) 
player.x -= player.speed/4, player.y += player.speed/4
//
if (keyboard.d && keyboard.s) 
player.x -= player.speed/4, player.y -= player.speed/4


  //scene höger
    if (player.x  > totalWidth) {
       player.x = 0;
        console.log("vänster")
        scene.x = scene.x +1
        
    }
 //scene vänster

     if (player.x  < 0) {
        
        player.x = totalWidth -1;
        console.log("höger")
        scene.x = scene.x -1
     }

//scene uppe

    if (player.y < 0) {
        player.y = totalHeight 
        scene.y = scene.y +1
        

    }

//scene nere

     if (player.y > totalHeight) {
        player.y = 1;
        scene.y = scene.y -1
        
     }

//scenes
if (scene.x == 0 && scene.y == 0)
triangle(500, 40, 620, 180, 430, 180, "green");


    }
  </script>
</body>
</html>

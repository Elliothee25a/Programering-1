<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blockvärlden</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      color: #f5f0df;
      background: #18252b;
      font-family: "Trebuchet MS", Arial, sans-serif;
    }

    .game {
      width: min(100%, 1000px);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      color: #a9e85d;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      letter-spacing: 1px;
      text-shadow: 2px 3px 0 #35542e;
    }

    .world-label {
      color: #c4d3d0;
      font-size: 0.9rem;
    }

    .game-window {
      position: relative;
      overflow: hidden;
      border: 5px solid #344c48;
      border-radius: 8px;
      background: #78c9e8;
      box-shadow: 0 12px 30px #0b1418aa;
    }

    canvas {
      display: block;
      width: 100%;
      height: min(68vh, 600px);
      min-height: 400px;
      image-rendering: pixelated;
      cursor: crosshair;
    }

    .hint {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 8px 11px;
      border: 1px solid #ffffff44;
      border-radius: 5px;
      background: #17272bc9;
      color: white;
      font-size: 0.84rem;
      pointer-events: none;
    }

    .hotbar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 10px;
    }

    .slot {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 112px;
      padding: 8px 10px;
      border: 2px solid #60726a;
      border-radius: 5px;
      background: #293b3b;
      color: #f5f0df;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .slot:hover {
      background: #3b514d;
    }

    .slot.selected {
      border-color: #ffe66d;
      background: #485343;
      box-shadow: 0 0 0 2px #ffe66d66;
    }

    .swatch {
      width: 25px;
      height: 25px;
      flex: 0 0 25px;
      border: 2px solid #ffffff44;
      box-shadow: inset -4px -4px #00000022;
    }

    .slot-info {
      display: grid;
      gap: 2px;
      font-size: 0.82rem;
    }

    .slot-info small {
      color: #c5d0c6;
    }

    .instructions {
      margin: 10px 0 0;
      color: #d5dfd8;
      font-size: 0.9rem;
      line-height: 1.6;
      text-align: center;
    }

    kbd {
      padding: 2px 5px;
      border: 1px solid #73857b;
      border-radius: 3px;
      background: #293b3b;
      color: white;
      font: inherit;
    }

    @media (max-width: 540px) {
      body {
        padding: 14px 10px;
      }

      .world-label {
        display: none;
      }

      canvas {
        min-height: 360px;
      }

      .slot {
        min-width: 95px;
      }
    }
  </style>
</head>
<body>
  <main class="game">
    <header>
      <h1>BLOCKVÄRLDEN</h1>
      <span class="world-label">Bygg din egen värld</span>
    </header>

    <div class="game-window">
      <canvas id="game" aria-label="Ett 2D-byggspel"></canvas>
      <div class="hint">Håll dig nära blocken för att bygga eller gräva</div>
    </div>

    <div class="hotbar" id="hotbar" aria-label="Välj block"></div>

    <p class="instructions">
      Gå: <kbd>A</kbd> <kbd>D</kbd> eller piltangenterna
      &nbsp; Hoppa: <kbd>mellanslag</kbd> eller <kbd>W</kbd>
      &nbsp; Gräv: vänsterklick
      &nbsp; Bygg: högerklick
      &nbsp; Välj block: <kbd>1</kbd>–<kbd>5</kbd>
    </p>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const context = canvas.getContext("2d");
    const hotbar = document.getElementById("hotbar");
    const tileSize = 32;
    const worldWidth = 100;
    const worldHeight = 36;
    const reach = tileSize * 5;
    const blockTypes = [
      { name: "Gräs", type: "grass", color: "#63b947", amount: 8, key: "1" },
      { name: "Jord", type: "dirt", color: "#96613c", amount: 12, key: "2" },
      { name: "Sten", type: "stone", color: "#899397", amount: 8, key: "3" },
      { name: "Trä", type: "wood", color: "#a87842", amount: 6, key: "4" },
      { name: "Löv", type: "leaves", color: "#438d42", amount: 6, key: "5" }
    ];
    const inventory = Object.fromEntries(blockTypes.map(block => [block.type, block.amount]));
    const world = Array.from({ length: worldHeight }, () => Array(worldWidth).fill(null));
    const keys = new Set();
    const mouse = { x: 0, y: 0, inside: false };

    let selectedBlock = 0;
    let cameraX = 0;
    let lastTime = 0;

    const player = {
      x: 5 * tileSize,
      y: 0,
      width: 22,
      height: 42,
      velocityX: 0,
      velocityY: 0,
      grounded: false
    };

    function terrainHeight(x) {
      return 13 + Math.round(
        Math.sin(x * 0.19) * 1.5 +
        Math.sin(x * 0.07) * 2 +
        Math.sin(x * 0.035) * 1.5
      );
    }

    function setBlock(x, y, type) {
      if (x >= 0 && x < worldWidth && y >= 0 && y < worldHeight) {
        world[y][x] = type;
      }
    }

    function createWorld() {
      for (let x = 0; x < worldWidth; x += 1) {
        const surface = terrainHeight(x);
        for (let y = surface; y < worldHeight; y += 1) {
          setBlock(x, y, y === surface ? "grass" : y < surface + 4 ? "dirt" : "stone");
        }
      }

      for (let x = 10; x < worldWidth - 3; x += 1) {
        if (x > 7 && x % 11 === 0 && Math.sin(x * 18) > -0.35) {
          const ground = terrainHeight(x);
          for (let y = ground - 4; y < ground; y += 1) {
            setBlock(x, y, "wood");
          }
          for (let y = ground - 7; y <= ground - 3; y += 1) {
            for (let leafX = x - 2; leafX <= x + 2; leafX += 1) {
              if (Math.abs(leafX - x) + Math.abs(y - (ground - 5)) < 4 && !world[y][leafX]) {
                setBlock(leafX, y, "leaves");
              }
            }
          }
        }
      }

      player.y = terrainHeight(5) * tileSize - player.height;
    }

    function resizeCanvas() {
      const bounds = canvas.getBoundingClientRect();
      canvas.width = Math.floor(bounds.width);
      canvas.height = Math.floor(bounds.height);
    }

    function drawBlock(type, x, y, size = tileSize) {
      const colors = {
        grass: "#63b947",
        dirt: "#96613c",
        stone: "#899397",
        wood: "#a87842",
        leaves: "#438d42"
      };
      const color = colors[type];
      context.fillStyle = color;
      context.fillRect(x, y, size, size);
      context.fillStyle = "rgba(255,255,255,0.13)";
      context.fillRect(x, y, size, 3);
      context.fillStyle = "rgba(0,0,0,0.14)";
      context.fillRect(x, y + size - 4, size, 4);

      if (type === "grass") {
        context.fillStyle = "#3f8f39";
        context.fillRect(x, y, size, 7);
        context.fillStyle = "#8a603d";
        context.fillRect(x, y + 7, size, size - 7);
      } else if (type === "wood") {
        context.fillStyle = "#80572f";
        context.fillRect(x + size * 0.28, y, 3, size);
        context.fillRect(x + size * 0.7, y, 2, size);
      } else if (type === "leaves") {
        context.fillStyle = "#5eaa4e";
        context.fillRect(x + 5, y + 6, 5, 5);
        context.fillRect(x + size - 11, y + size - 12, 4, 4);
      } else {
        context.fillStyle = "rgba(255,255,255,0.16)";
        context.fillRect(x + 7, y + 9, 5, 4);
        context.fillRect(x + size - 11, y + size - 12, 4, 4);
      }
      context.strokeStyle = "rgba(25,35,30,0.2)";
      context.strokeRect(x + 0.5, y + 0.5, size - 1, size - 1);
    }

    function getBlockAt(column, row) {
      if (column < 0 || column >= worldWidth || row < 0 || row >= worldHeight) {
        return null;
      }
      return world[row][column];
    }

    function collides(x, y, width, height) {
      const left = Math.floor(x / tileSize);
      const right = Math.floor((x + width - 1) / tileSize);
      const top = Math.floor(y / tileSize);
      const bottom = Math.floor((y + height - 1) / tileSize);

      for (let row = top; row <= bottom; row += 1) {
        for (let column = left; column <= right; column += 1) {
          if (getBlockAt(column, row)) {
            return true;
          }
        }
      }
      return false;
    }

    function movePlayer(delta) {
      const speed = 190;
      player.velocityX = 0;
      if (keys.has("a") || keys.has("arrowleft")) player.velocityX -= speed;
      if (keys.has("d") || keys.has("arrowright")) player.velocityX += speed;

      const nextX = player.x + player.velocityX * delta;
      if (!collides(nextX, player.y, player.width, player.height)) {
        player.x = Math.max(0, Math.min(worldWidth * tileSize - player.width, nextX));
      }

      player.velocityY = Math.min(player.velocityY + 1050 * delta, 700);
      const nextY = player.y + player.velocityY * delta;
      if (!collides(player.x, nextY, player.width, player.height)) {
        player.y = nextY;
        player.grounded = false;
      } else {
        if (player.velocityY > 0) {
          player.y = Math.floor((player.y + player.height) / tileSize) * tileSize - player.height;
          player.grounded = true;
        } else {
          player.y = Math.ceil(player.y / tileSize) * tileSize;
        }
        player.velocityY = 0;
      }
    }

    function screenToTile(screenX, screenY) {
      return {
        x: Math.floor((screenX + cameraX) / tileSize),
        y: Math.floor(screenY / tileSize)
      };
    }

    function isInReach(column, row) {
      const blockX = column * tileSize + tileSize / 2;
      const blockY = row * tileSize + tileSize / 2;
      const playerX = player.x + player.width / 2;
      const playerY = player.y + player.height / 2;
      return Math.hypot(blockX - playerX, blockY - playerY) <= reach;
    }

    function mineBlock(column, row) {
      if (!isInReach(column, row)) return;
      const type = getBlockAt(column, row);
      if (!type) return;
      world[row][column] = null;
      if (Object.hasOwn(inventory, type)) {
        inventory[type] += 1;
        updateHotbar();
      }
    }

    function placeBlock(column, row) {
      const selected = blockTypes[selectedBlock].type;
      if (!isInReach(column, row) || getBlockAt(column, row) || inventory[selected] <= 0) return;
      const overlapsPlayer =
        player.x < (column + 1) * tileSize &&
        player.x + player.width > column * tileSize &&
        player.y < (row + 1) * tileSize &&
        player.y + player.height > row * tileSize;
      if (overlapsPlayer) return;
      setBlock(column, row, selected);
      inventory[selected] -= 1;
      updateHotbar();
    }

    function updateHotbar() {
      hotbar.replaceChildren();
      blockTypes.forEach((block, index) => {
        const button = document.createElement("button");
        button.className = `slot${index === selectedBlock ? " selected" : ""}`;
        button.type = "button";
        button.setAttribute("aria-label", `${block.name}, ${inventory[block.type]} stycken`);
        button.innerHTML = `
          <span class="swatch" style="background:${block.color}"></span>
          <span class="slot-info"><span>${block.key}. ${block.name}</span>
          <small>${inventory[block.type]} st</small></span>`;
        button.addEventListener("click", () => {
          selectedBlock = index;
          updateHotbar();
        });
        hotbar.append(button);
      });
    }

    function drawScene() {
      const width = canvas.width;
      const height = canvas.height;
      const sky = context.createLinearGradient(0, 0, 0, height);
      sky.addColorStop(0, "#65b8df");
      sky.addColorStop(1, "#d5f0d1");
      context.fillStyle = sky;
      context.fillRect(0, 0, width, height);

      context.fillStyle = "#fff2ad";
      context.beginPath();
      context.arc(width - 90, 82, 34, 0, Math.PI * 2);
      context.fill();

      context.fillStyle = "rgba(255,255,255,0.42)";
      for (let i = 0; i < 4; i += 1) {
        const cloudX = ((i * 247 - cameraX * 0.15) % (width + 140) + width + 140) % (width + 140) - 70;
        context.fillRect(cloudX, 90 + (i % 2) * 48, 74, 14);
        context.fillRect(cloudX + 15, 79 + (i % 2) * 48, 42, 13);
      }

      const firstColumn = Math.max(0, Math.floor(cameraX / tileSize));
      const lastColumn = Math.min(worldWidth, Math.ceil((cameraX + width) / tileSize) + 1);
      for (let row = 0; row < worldHeight; row += 1) {
        for (let column = firstColumn; column < lastColumn; column += 1) {
          const type = world[row][column];
          if (type) {
            drawBlock(type, column * tileSize - cameraX, row * tileSize);
          }
        }
      }

      if (mouse.inside) {
        const target = screenToTile(mouse.x, mouse.y);
        const tileX = target.x * tileSize - cameraX;
        const tileY = target.y * tileSize;
        context.strokeStyle = isInReach(target.x, target.y) ? "#fff3a1" : "#ef786b";
        context.lineWidth = 2;
        context.strokeRect(tileX + 1, tileY + 1, tileSize - 2, tileSize - 2);
      }

      drawPlayer(player.x - cameraX, player.y);
    }

    function drawPlayer(x, y) {
      context.fillStyle = "#3b6db1";
      context.fillRect(x + 2, y + 17, 18, 21);
      context.fillStyle = "#3c2d25";
      context.fillRect(x + 2, y + 36, 7, 6);
      context.fillRect(x + 13, y + 36, 7, 6);
      context.fillStyle = "#f0bd8d";
      context.fillRect(x + 1, y, 20, 18);
      context.fillStyle = "#65452f";
      context.fillRect(x, y, 22, 6);
      context.fillStyle = "#292c35";
      context.fillRect(x + 5, y + 8, 3, 3);
      context.fillRect(x + 15, y + 8, 3, 3);
    }

    function gameLoop(time) {
      const delta = Math.min((time - lastTime) / 1000 || 0, 0.033);
      lastTime = time;
      movePlayer(delta);
      cameraX = Math.max(0, Math.min(
        worldWidth * tileSize - canvas.width,
        player.x + player.width / 2 - canvas.width / 2
      ));
      drawScene();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();
      if ([" ", "arrowleft", "arrowright", "arrowup"].includes(key)) {
        event.preventDefault();
      }
      keys.add(key);
      if ((key === " " || key === "w" || key === "arrowup") && player.grounded) {
        player.velocityY = -430;
        player.grounded = false;
      }
      const blockIndex = Number(key) - 1;
      if (blockIndex >= 0 && blockIndex < blockTypes.length) {
        selectedBlock = blockIndex;
        updateHotbar();
      }
    });

    window.addEventListener("keyup", event => keys.delete(event.key.toLowerCase()));
    window.addEventListener("blur", () => keys.clear());

    canvas.addEventListener("pointermove", event => {
      const bounds = canvas.getBoundingClientRect();
      mouse.x = event.clientX - bounds.left;
      mouse.y = event.clientY - bounds.top;
      mouse.inside = true;
    });
    canvas.addEventListener("pointerleave", () => mouse.inside = false);
    canvas.addEventListener("pointerdown", event => {
      if (event.button !== 0 && event.button !== 2) return;
      const target = screenToTile(mouse.x, mouse.y);
      if (event.button === 0) mineBlock(target.x, target.y);
      if (event.button === 2) placeBlock(target.x, target.y);
    });
    canvas.addEventListener("contextmenu", event => event.preventDefault());

    window.addEventListener("resize", resizeCanvas);
    createWorld();
    resizeCanvas();
    updateHotbar();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>

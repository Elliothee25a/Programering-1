<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N-Body Physics Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff;
        }
        
        canvas {
            border: 2px solid #fff;
            background-color: #000;
            display: block;
            margin: 20px 0;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        button {
            padding: 10px 20px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        
        button:hover {
            background-color: #0052a3;
        }
        
        button:disabled {
            background-color: #666;
            cursor: not-allowed;
        }
        
        .info {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 14px;
            margin-top: 20px;
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .label {
            font-weight: bold;
            color: #0088ff;
        }
        
        input[type="range"] {
            width: 150px;
        }
        
        .slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <h1>N-Body Gravity Simulation</h1>
    
    <div class="controls">
        <button id="startBtn">Start Simulation</button>
        <button id="pauseBtn" disabled>Pause</button>
        <button id="resetBtn">Reset</button>
        <button id="addRandomBtn">Add Random Body</button>
    </div>
    
    <div class="controls">
        <div class="slider-group">
            <label for="gravitySlider">Gravity Strength:</label>
            <input type="range" id="gravitySlider" min="10" max="200" value="100">
            <span id="gravityValue">100</span>
        </div>
        <div class="slider-group">
            <label for="timeStepSlider">Time Step:</label>
            <input type="range" id="timeStepSlider" min="0.01" max="0.5" step="0.01" value="0.016">
            <span id="timeStepValue">0.016</span>
        </div>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <div class="info">
        <div class="info-item">
            <span class="label">Bodies:</span>
            <span id="bodyCount">5</span>
        </div>
        <div class="info-item">
            <span class="label">Time:</span>
            <span id="timeElapsed">0.00s</span>
        </div>
        <div class="info-item">
            <span class="label">FPS:</span>
            <span id="fps">0</span>
        </div>
        <div class="info-item">
            <span class="label">Total Energy:</span>
            <span id="energy">0</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth - 40;
        canvas.height = window.innerHeight - 350;
        
        // Constants
        const G = 100; // Gravitational constant (adjusted for visualization)
        const SOFTENING = 10; // Prevents singularities
        const MAX_VELOCITY = 500;
        
        class Body {
            constructor(x, y, vx = 0, vy = 0, mass = 1) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.ax = 0;
                this.ay = 0;
                this.mass = mass;
                this.trail = [];
                this.maxTrailLength = 50;
            }
            
            update(dt) {
                // Update velocity
                this.vx += this.ax * dt;
                this.vy += this.ay * dt;
                
                // Limit velocity
                const speed = Math.sqrt(this.vx ** 2 + this.vy ** 2);
                if (speed > MAX_VELOCITY) {
                    this.vx = (this.vx / speed) * MAX_VELOCITY;
                    this.vy = (this.vy / speed) * MAX_VELOCITY;
                }
                
                // Update position
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                
                // Reset acceleration
                this.ax = 0;
                this.ay = 0;
                
                // Add to trail
                this.trail.push({x: this.x, y: this.y});
                if (this.trail.length > this.maxTrailLength) {
                    this.trail.shift();
                }
            }
            
            draw(ctx) {
                // Draw trail
                if (this.trail.length > 1) {
                    ctx.strokeStyle = `rgba(100, 150, 255, 0.3)`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(this.trail[0].x, this.trail[0].y);
                    for (let i = 1; i < this.trail.length; i++) {
                        ctx.lineTo(this.trail[i].x, this.trail[i].y);
                    }
                    ctx.stroke();
                }
                
                // Draw body
                const radius = Math.sqrt(this.mass) * 2;
                ctx.fillStyle = `hsl(${(this.mass * 50) % 360}, 100%, 50%)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw velocity vector
                const scale = 0.1;
                ctx.strokeStyle = 'rgba(255, 100, 100, 0.5)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + this.vx * scale, this.y + this.vy * scale);
                ctx.stroke();
            }
        }
        
        class NBodySimulation {
            constructor() {
                this.bodies = [];
                this.isRunning = false;
                this.timeElapsed = 0;
                this.gravityStrength = 100;
                this.timeStep = 0.016;
                this.frameCount = 0;
                this.lastFpsTime = Date.now();
                this.initializeBodies();
            }
            
            initializeBodies() {
                this.bodies = [];
                this.timeElapsed = 0;
                
                // Create some initial bodies
                // Sun
                this.bodies.push(new Body(
                    canvas.width / 2,
                    canvas.height / 2,
                    0, 0,
                    3
                ));
                
                // Planets in orbit
                for (let i = 0; i < 4; i++) {
                    const angle = (Math.PI * 2 * i) / 4;
                    const distance = 100 + i * 60;
                    const x = canvas.width / 2 + Math.cos(angle) * distance;
                    const y = canvas.height / 2 + Math.sin(angle) * distance;
                    const orbitalSpeed = Math.sqrt((G * this.gravityStrength * 3) / distance) * 0.5;
                    const vx = -Math.sin(angle) * orbitalSpeed;
                    const vy = Math.cos(angle) * orbitalSpeed;
                    this.bodies.push(new Body(x, y, vx, vy, 0.5));
                }
            }
            
            calculateForces() {
                for (let i = 0; i < this.bodies.length; i++) {
                    for (let j = i + 1; j < this.bodies.length; j++) {
                        this.applyForce(this.bodies[i], this.bodies[j]);
                    }
                }
            }
            
            applyForce(body1, body2) {
                const dx = body2.x - body1.x;
                const dy = body2.y - body1.y;
                const distSq = dx * dx + dy * dy + SOFTENING * SOFTENING;
                const dist = Math.sqrt(distSq);
                
                const f = (G * this.gravityStrength * body1.mass * body2.mass) / distSq;
                const fx = (f * dx) / dist;
                const fy = (f * dy) / dist;
                
                body1.ax += fx / body1.mass;
                body1.ay += fy / body1.mass;
                
                body2.ax -= fx / body2.mass;
                body2.ay -= fy / body2.mass;
            }
            
            update(dt) {
                this.calculateForces();
                
                for (let body of this.bodies) {
                    body.update(dt);
                    
                    // Wrap around edges
                    if (body.x < 0) body.x = canvas.width;
                    if (body.x > canvas.width) body.x = 0;
                    if (body.y < 0) body.y = canvas.height;
                    if (body.y > canvas.height) body.y = 0;
                }
                
                this.timeElapsed += dt;
            }
            
            draw() {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                for (let body of this.bodies) {
                    body.draw(ctx);
                }
            }
            
            getTotalEnergy() {
                let kineticEnergy = 0;
                let potentialEnergy = 0;
                
                for (let body of this.bodies) {
                    kineticEnergy += 0.5 * body.mass * (body.vx ** 2 + body.vy ** 2);
                }
                
                for (let i = 0; i < this.bodies.length; i++) {
                    for (let j = i + 1; j < this.bodies.length; j++) {
                        const dx = this.bodies[j].x - this.bodies[i].x;
                        const dy = this.bodies[j].y - this.bodies[i].y;
                        const dist = Math.sqrt(dx * dx + dy * dy) + SOFTENING;
                        potentialEnergy -= (G * this.gravityStrength * this.bodies[i].mass * this.bodies[j].mass) / dist;
                    }
                }
                
                return kineticEnergy + potentialEnergy;
            }
            
            addRandomBody() {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const vx = (Math.random() - 0.5) * 200;
                const vy = (Math.random() - 0.5) * 200;
                const mass = Math.random() * 1.5 + 0.3;
                this.bodies.push(new Body(x, y, vx, vy, mass));
            }
        }
        
        let simulation = new NBodySimulation();
        
        // UI Controls
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const addRandomBtn = document.getElementById('addRandomBtn');
        const gravitySlider = document.getElementById('gravitySlider');
        const timeStepSlider = document.getElementById('timeStepSlider');
        const bodyCount = document.getElementById('bodyCount');
        const timeDisplay = document.getElementById('timeElapsed');
        const fpsDisplay = document.getElementById('fps');
        const energyDisplay = document.getElementById('energy');
        const gravityValue = document.getElementById('gravityValue');
        const timeStepValue = document.getElementById('timeStepValue');
        
        startBtn.addEventListener('click', () => {
            simulation.isRunning = true;
            startBtn.disabled = true;
            pauseBtn.disabled = false;
        });
        
        pauseBtn.addEventListener('click', () => {
            simulation.isRunning = false;
            pauseBtn.disabled = true;
            startBtn.disabled = false;
        });
        
        resetBtn.addEventListener('click', () => {
            simulation.isRunning = false;
            simulation.initializeBodies();
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            draw();
        });
        
        addRandomBtn.addEventListener('click', () => {
            simulation.addRandomBody();
        });
        
        gravitySlider.addEventListener('input', (e) => {
            simulation.gravityStrength = parseFloat(e.target.value);
            gravityValue.textContent = e.target.value;
        });
        
        timeStepSlider.addEventListener('input', (e) => {
            simulation.timeStep = parseFloat(e.target.value);
            timeStepValue.textContent = e.target.value.toFixed(3);
        });
        
        function draw() {
            if (simulation.isRunning) {
                simulation.update(simulation.timeStep);
            }
            
            simulation.draw();
            
            // Update UI
            bodyCount.textContent = simulation.bodies.length;
            timeDisplay.textContent = simulation.timeElapsed.toFixed(2) + 's';
            energyDisplay.textContent = simulation.getTotalEnergy().toFixed(0);
            
            // FPS counter
            simulation.frameCount++;
            const now = Date.now();
            if (now - simulation.lastFpsTime >= 1000) {
                fpsDisplay.textContent = simulation.frameCount;
                simulation.frameCount = 0;
                simulation.lastFpsTime = now;
            }
            
            requestAnimationFrame(draw);
        }
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth - 40;
            canvas.height = window.innerHeight - 350;
        });
        
        // Start animation loop
        draw();
    </script>
</body>
</html>

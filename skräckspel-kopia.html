<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skräckspel - skogskopia</title>
</head>
<body>
  <script src="http://koda.nu/simple.js">
// Spelet uppdateras 60 gånger per sekund.
updatesPerSecond = 60
// HUD:en tar denna del av skärmen; spelvärlden och scenbyten slutar ovanför den.
var HUD_HEIGHT = 132

function playfieldBottom() {
    return totalHeight - HUD_HEIGHT
}

// Spelarens koordinat i världen: varje gång spelaren går utanför kanten byts scen.
var scene = {
    x: 0,
    y: 0
}

// Spelarens position, utseende, rörelse, nuvarande vapen och ammunition.
// Varje vapentyp har ett eget ammunitionsförråd som finns kvar vid vapenbyte.
var player = {
    x: totalWidth / 2,
    y: Math.min(playfieldBottom() - 35, 230),
    size: 15,
    speed: 4,
    sprintSpeed: 7,
    stamina: 100,
    maxStamina: 100,
    sprintLocked: false,
    weapon: null,
    ammo: 0,
    pistolAmmo: 0,
    shotgunAmmo: 0,
    smgAmmo: 0,
    rocketAmmo: 0,
    revolverAmmo: 0,
    rifleAmmo: 0,
    flameAmmo: 0,
    facing: "down",
    lives: 3,
    shields: 0,
    killsTowardReward: 0,
    invulnerableUntil: 0,
    hitFrame: -1000
}

// Sparar innehållet i varje besökt scen så att scenen finns kvar när man återvänder.
var scenes = {}
// Sparar om en viss y-nivå valdes till bossnivå, så x-scener delar samma val.
var bossDepths = {}
// Projektilerna som är på väg genom den aktuella scenen.
var bullets = []
// Styr om spelet ska avslutas efter att spelaren träffats av en zombie.
var gameOver = false
// Finalbossens segerläge visas separat från spelarens game over.
var victory = false
var victoryFrame = 0
// Bildrutan då spelaren dog används för att animera skräcken och slutskärmen.
var deathFrame = 0
// Sparar vilken y-nivå spelaren var på när döden inträffade.
var deathLevel = 0
// Kommer ihåg om mellanslag var nedtryckt förra bildrutan, så ett tryck ger ett skott.
var spaceWasDown = false
// Kommer ihåg Q-knappens läge så vapnen bara byts en gång per knapptryckning.
var weaponSwitchWasDown = false
// Sparar en tryckt vapenslot tills huvudloopen kan välja vapnet.
var pendingHotbarSelection = -1
// Senaste siktade riktning; den sparas när spelaren slutar röra sig.
var aimX = 1
var aimY = 0
// Räknar bildrutor och används bland annat för blinkande effekter och speltid.
var frameCount = 0
// Poäng för besegrade zombier och tid spelaren överlevde.
var score = 0
var survivedSeconds = 0
// Webbläsarens ljudmotor. Den skapas efter första tangenttrycket för att tillåta ljud.
var audioContext = null
// Kommer ihåg senaste musikpulsen så melodin bara startar en gång per takt.
var lastMusicBeat = -1
var lastMusicMode = -1
// Sparar när senaste fotsteget spelades så ljudet inte upprepas varje bildruta.
var lastFootstepFrame = 0
// Kommer ihåg föregående sprintläge så sprintljudet bara spelas när sprinten startar.
var wasSprinting = false

// Startar ljudmotorn först efter en tangenttryckning, när webbläsaren tillåter ljud.
function unlockAudio() {
    // En redan skapad ljudmotor kan vara pausad av webbläsaren; försök återuppta den.
    if (audioContext) {
        if (audioContext.state === "suspended") audioContext.resume()
        return
    }

    // Olika webbläsare kan använda olika namn för Web Audio-klassen.
    var AudioContextType = window.AudioContext || window.webkitAudioContext
    if (AudioContextType) {
        audioContext = new AudioContextType()
        audioContext.resume()
    }
}

// Lyssna efter användarens första tangenttryck så webbläsarens ljudspärr släpps.
document.addEventListener("keydown", unlockAudio)
// Läs sifferknapparna direkt från webbläsaren, oberoende av Simple.js tangentbordsobjekt.
document.addEventListener("keydown", function (event) {
    var keyCode = event.code || ""
    if (keyCode.indexOf("Digit") === 0 || keyCode.indexOf("Numpad") === 0) {
        var slotNumber = Number(keyCode.replace("Digit", "").replace("Numpad", ""))
        if (slotNumber >= 1 && slotNumber <= 7) {
            pendingHotbarSelection = slotNumber - 1
        }
    }
})

// Spelar en kort ton med mjuk volymkurva och valfri tonhöjdsändring.
function playTone(frequency, duration, wave, volume, endFrequency) {
    // Om ljudet inte har aktiverats ännu avslutas funktionen utan att påverka spelet.
    if (!audioContext) return
    // Oscillatorn skapar tonen och gain-noden styr volymen över tid.
    var oscillator = audioContext.createOscillator()
    var gain = audioContext.createGain()
    var now = audioContext.currentTime
    // Vågformen ger tonen dess klang; frekvensändring kan skapa en glidande ton.
    oscillator.type = wave || "square"
    oscillator.frequency.setValueAtTime(frequency, now)
    if (endFrequency) oscillator.frequency.linearRampToValueAtTime(endFrequency, now + duration)
    gain.gain.setValueAtTime(volume || 0.08, now)
    // Tonen tonas ut i stället för att stoppas tvärt.
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration)
    // Koppla ljuddelarna till datorns högtalare och starta ljudet.
    oscillator.connect(gain)
    gain.connect(audioContext.destination)
    oscillator.start(now)
    oscillator.stop(now + duration)
}

// Spelar ett kort brus för skott, steg och explosioner.
function playNoise(duration, volume, frequency) {
    if (!audioContext) return
    // Skapa en buffert med slumpvärden; avtagande styrka gör bruset kort.
    var sampleCount = Math.floor(audioContext.sampleRate * duration)
    var buffer = audioContext.createBuffer(1, sampleCount, audioContext.sampleRate)
    var data = buffer.getChannelData(0)
    for (var i = 0; i < sampleCount; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / sampleCount)
    }

    // Filtrera bruset och tona ut det innan det skickas till högtalarna.
    var source = audioContext.createBufferSource()
    var filter = audioContext.createBiquadFilter()
    var gain = audioContext.createGain()
    var now = audioContext.currentTime
    source.buffer = buffer
    filter.type = "lowpass"
    filter.frequency.setValueAtTime(frequency || 1800, now)
    gain.gain.setValueAtTime(volume || 0.12, now)
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration)
    source.connect(filter)
    filter.connect(gain)
    gain.connect(audioContext.destination)
    source.start(now)
}

// Samlar spelets olika ljudeffekter under namn som går att anropa från spellogiken.
function playSound(name) {
    if (!audioContext) return
    // Varje namn kombinerar toner och brus med olika längd och tonhöjd.
    if (name === "pistol") {
        playNoise(0.09, 0.2, 2400)
        playTone(150, 0.1, "square", 0.08, 55)
        playTone(720, 0.035, "triangle", 0.025, 310)
    } else if (name === "revolver") {
        playNoise(0.14, 0.24, 1900)
        playTone(125, 0.16, "sawtooth", 0.1, 42)
        playTone(480, 0.06, "square", 0.035, 140)
    } else if (name === "rifle") {
        playNoise(0.11, 0.18, 2800)
        playTone(210, 0.12, "square", 0.075, 75)
        playTone(1100, 0.045, "triangle", 0.025, 440)
    } else if (name === "flame") {
        playNoise(0.12, 0.15, 850)
        playTone(95, 0.13, "sawtooth", 0.07, 60)
        playTone(180, 0.1, "triangle", 0.035, 75)
    } else if (name === "shotgun") {
        playNoise(0.2, 0.3, 1300)
        playTone(95, 0.18, "sawtooth", 0.12, 35)
        playNoise(0.08, 0.14, 450)
    } else if (name === "smg") {
        playNoise(0.045, 0.11, 2600)
        playTone(190, 0.045, "square", 0.045, 90)
        playTone(540, 0.025, "triangle", 0.018, 260)
    } else if (name === "rocket") {
        playNoise(0.25, 0.22, 900)
        playTone(100, 0.3, "sawtooth", 0.1, 45)
        playTone(320, 0.22, "triangle", 0.05, 60)
    } else if (name === "explosion") {
        playNoise(0.55, 0.38, 700)
        playTone(70, 0.5, "sawtooth", 0.16, 25)
    } else if (name === "hit") {
        playTone(220, 0.12, "square", 0.08, 75)
    } else if (name === "kill") {
        playTone(300, 0.1, "triangle", 0.09, 110)
    } else if (name === "pickup") {
        playTone(520, 0.1, "square", 0.07, 780)
        playTone(780, 0.14, "triangle", 0.055, 1040)
    } else if (name === "ammo") {
        playTone(420, 0.1, "square", 0.06, 620)
    } else if (name === "scene") {
        playTone(260, 0.18, "triangle", 0.06, 180)
    } else if (name === "footstep") {
        playNoise(0.035, 0.045, 500)
    } else if (name === "sprint") {
        playTone(180, 0.12, "triangle", 0.055, 360)
    } else if (name === "staminaEmpty") {
        playTone(220, 0.2, "square", 0.08, 90)
    } else if (name === "bossWarning") {
        playTone(130, 0.3, "sawtooth", 0.12, 55)
    } else if (name === "bossDash") {
        playNoise(0.35, 0.2, 1100)
        playTone(90, 0.3, "sawtooth", 0.11, 35)
    } else if (name === "bossHit") {
        playTone(100, 0.18, "square", 0.12, 45)
    } else if (name === "bossDeath") {
        playNoise(0.8, 0.3, 500)
        playTone(180, 0.8, "sawtooth", 0.13, 30)
    } else if (name === "gameOver") {
        playTone(220, 0.5, "sawtooth", 0.12, 55)
        playTone(110, 0.9, "triangle", 0.08, 35)
    } else if (name === "playerHit") {
        playNoise(0.22, 0.22, 500)
        playTone(190, 0.24, "sawtooth", 0.11, 42)
    } else if (name === "victory") {
        playTone(392, 0.42, "triangle", 0.09, 440)
        playTone(523.25, 0.52, "square", 0.065, 587.33)
        playTone(659.25, 0.72, "triangle", 0.075, 783.99)
    }
}

// Spelar en egen loopande skräckmelodi som blir snabbare och mer trasig på större djup.
function playBackgroundMusic(depth, finalBossMusic) {
    if (!audioContext) return

    var levelDepth = Math.max(0, Math.floor(depth))
    var musicMode = finalBossMusic ? 1 : 0
    if (musicMode !== lastMusicMode) {
        lastMusicBeat = -1
        lastMusicMode = musicMode
    }
    var beatFrames = finalBossMusic ? 18 : Math.max(24, 54 - Math.min(24, levelDepth))
    var beat = Math.floor(frameCount / beatFrames)
    if (beat === lastMusicBeat) return
    lastMusicBeat = beat

    // En långsam mollslinga ger musiken ett återkommande, olycksbådande tema.
    var bassNotes = finalBossMusic ? [49, 55, 49, 65.41, 58.27, 49, 46.25, 58.27] : [65.41, 73.42, 58.27, 65.41, 55, 73.42, 58.27, 49]
    var melodyNotes = finalBossMusic ? [98, 103.83, 110, 82.41, 98, 73.42, 110, 92.5] : [196, 174.61, 207.65, 164.81, 185, 146.83, 174.61, 155.56]
    var noteIndex = beat % bassNotes.length
    var glitchLevel = Math.min(0.58, levelDepth * 0.025)
    var bassFrequency = bassNotes[noteIndex]
    var melodyFrequency = melodyNotes[noteIndex]

    // Längre in kan melodin plötsligt bli falsk eller hoppa upp en oktav.
    if (Math.random() < glitchLevel) {
        melodyFrequency *= Math.random() < 0.5 ? 1.414 : 0.943
    }

    playTone(bassFrequency, beatFrames / updatesPerSecond * (finalBossMusic ? 0.72 : 0.82), finalBossMusic || levelDepth >= 8 ? "sawtooth" : "triangle", finalBossMusic ? 0.07 : 0.024, bassFrequency * (finalBossMusic ? 0.72 : 0.9))
    if (beat % (finalBossMusic ? 2 : 3) !== 2) {
        var melodyWave = finalBossMusic || levelDepth >= 8 ? "square" : "triangle"
        playTone(melodyFrequency, beatFrames / updatesPerSecond * 0.48, melodyWave, finalBossMusic ? 0.032 : 0.016 + Math.min(0.008, levelDepth * 0.0004), melodyFrequency * (finalBossMusic ? 1.12 : 0.94))
    }
    if (beat % (finalBossMusic ? 4 : 6) === 0) {
        playTone(finalBossMusic ? 38 : 43.65, 0.12, "sine", finalBossMusic ? 0.08 : 0.045, finalBossMusic ? 26 : 32.7)
    }

    // Korta brus och avbrutna höga toner låter som störningar i en trasig radiosignal.
    if (Math.random() < (finalBossMusic ? 0.28 : 0.02 + glitchLevel * 0.52)) {
        var staticDuration = 0.02 + Math.random() * (finalBossMusic ? 0.07 : 0.02 + glitchLevel * 0.05)
        playNoise(staticDuration, finalBossMusic ? 0.025 : 0.009 + glitchLevel * 0.02, 500 + Math.random() * (1400 + levelDepth * 120))
        if (levelDepth >= 5 && Math.random() < glitchLevel) {
            var glitchFrequency = 260 + Math.random() * 900
            playTone(glitchFrequency, staticDuration, "square", 0.012 + glitchLevel * 0.018, glitchFrequency * (Math.random() < 0.5 ? 0.5 : 1.8))
        }
    }
}

// Tar ett liv, lämnar blod i scenen och ger kort osårbarhet så en kontakt inte tömmer alla liv.
function loseLife(currentScene) {
    if (gameOver || victory || frameCount < player.invulnerableUntil) return false
    if (player.shields > 0) {
        player.shields -= 1
    } else {
        player.lives = Math.max(0, player.lives - 1)
    }
    player.hitFrame = frameCount
    player.invulnerableUntil = frameCount + updatesPerSecond * 1.25
    addBloodSplatter(currentScene, player.x, player.y, true)
    playSound("playerHit")
    if (player.lives === 0) triggerGameOver()
    return true
}

// Startar game over en enda gång, oavsett vad som träffade spelaren.
function triggerGameOver() {
    if (gameOver || victory) return
    gameOver = true
    deathFrame = frameCount
    deathLevel = Math.min(20, Math.abs(scene.y))
    playSound("gameOver")
}

// Avslutar spelet först när den sista bossen på nivån x:0, y:20 besegras.
function triggerVictory() {
    if (victory || gameOver) return
    victory = true
    victoryFrame = frameCount
    bullets = []
    playSound("victory")
}

// Räknar ut avståndet mellan två punkter på spelplanen.
function distanceBetween(x1, y1, x2, y2) {
    // Pythagoras sats: kvadrera skillnaderna i x och y och ta sedan roten.
    var dx = x1 - x2
    var dy = y1 - y2
    return Math.sqrt(dx * dx + dy * dy)
}

// Väljer en slumpmässig position innanför scenens kanter och under vägbarriären.
function randomPosition() {
    var fieldBottom = playfieldBottom()
    return {
        // Lämna en liten kantmarginal så saker inte hamnar utanför skärmen.
        x: 35 + Math.random() * (totalWidth - 70),
        // På startnivån placeras saker nedanför vägen; på andra nivåer används större delen av skärmen.
        y: scene.y === 0 ? 175 + Math.random() * Math.max(1, fieldBottom - 210) : 45 + Math.random() * Math.max(1, fieldBottom - 90)
    }
}

// Håller fiender långt från alla scenkanter så de inte väntar vid spelarens ingång.
function randomEnemyPosition() {
    var marginX = Math.min(115, totalWidth / 4)
    var fieldBottom = playfieldBottom()
    var marginY = Math.min(100, fieldBottom / 4)
    var bestPosition = { x: totalWidth / 2, y: fieldBottom / 2 }
    var bestDistance = -1
    for (var attempt = 0; attempt < 40; attempt++) {
        var candidate = {
            x: marginX + Math.random() * (totalWidth - marginX * 2),
            y: marginY + Math.random() * (fieldBottom - marginY * 2)
        }
        var entryDistance = distanceBetween(candidate.x, candidate.y, player.x, player.y)
        if (entryDistance > bestDistance) {
            bestPosition = candidate
            bestDistance = entryDistance
        }
        if (entryDistance >= 170) return candidate
    }
    return bestPosition
}

// Välj loot efter avstånd: raketkastare och SMG låses upp längre från start.
function chooseWeapon(depth, roll) {
    // roll är ett slumpvärde mellan 0 och 1; gränserna bestämmer vapenchanserna.
    // Nya vapen blir tillgängliga längre in; alla scener väljer sedan bara ett.
    if (depth >= 8) {
        if (roll < 0.16) return "rocket"
        if (roll < 0.32) return "flame"
        if (roll < 0.48) return "rifle"
        if (roll < 0.64) return "smg"
        if (roll < 0.78) return "revolver"
        if (roll < 0.9) return "shotgun"
    } else if (depth >= 5) {
        if (roll < 0.1) return "rocket"
        if (roll < 0.2) return "flame"
        if (roll < 0.38) return "rifle"
        if (roll < 0.58) return "smg"
        if (roll < 0.76) return "shotgun"
        if (roll < 0.9) return "revolver"
    } else if (depth >= 2) {
        if (roll < 0.28) return "rifle"
        if (roll < 0.5) return "smg"
        if (roll < 0.72) return "shotgun"
        if (roll < 0.9) return "revolver"
    } else if (roll < 0.25) {
        return "revolver"
    } else if (roll < 0.45) {
        return "shotgun"
    }
    return "pistol"
}

// Skapar innehållet för en ny scen: träd, zombier, vapen och ibland ett hus.
function makeScene() {
    // Samlar alla saker som hör till den här scenen.
    var content = {
        trees: [],
        enemies: [],
        enemyShots: [],
        blood: [],
        foliage: [],
        buildings: [],
        weapons: [],
        house: null,
        boss: null,
        bossLevel: false
    }
    // Skräckdetaljer använder bara avståndet längs y-axeln, precis som svårighetsgraden.
    var depth = Math.abs(scene.y)
    content.depth = depth

    // Varje lista börjar tom och fylls på medan scenen skapas.

    // Längre in blir marken tätare av aska, ben, blodspår, runor och gravmarkörer.
    var foliageCount = 34 + Math.floor(Math.random() * 25) + Math.min(36, depth * 2)
    for (var foliageIndex = 0; foliageIndex < foliageCount; foliageIndex++) {
        var foliagePosition = randomPosition()
        var foliageRoll = Math.random()
        var foliageType = "grass"
        if (depth < 2) {
            foliageType = foliageRoll < 0.42 ? "grass" : foliageRoll < 0.64 ? "dirt" : foliageRoll < 0.84 ? "stones" : "weeds"
        } else if (depth < 5) {
            foliageType = foliageRoll < 0.34 ? "grass" : foliageRoll < 0.53 ? "dirt" : foliageRoll < 0.7 ? "stones" : foliageRoll < 0.86 ? "weeds" : foliageRoll < 0.95 ? "bones" : "blood"
        } else if (depth < 9) {
            foliageType = foliageRoll < 0.22 ? "grass" : foliageRoll < 0.4 ? "dirt" : foliageRoll < 0.55 ? "stones" : foliageRoll < 0.69 ? "weeds" : foliageRoll < 0.81 ? "bones" : foliageRoll < 0.92 ? "blood" : "rune"
        } else {
            foliageType = foliageRoll < 0.13 ? "grass" : foliageRoll < 0.29 ? "dirt" : foliageRoll < 0.43 ? "stones" : foliageRoll < 0.56 ? "weeds" : foliageRoll < 0.7 ? "bones" : foliageRoll < 0.82 ? "blood" : foliageRoll < 0.93 ? "rune" : "grave"
        }
        content.foliage.push({
            x: foliagePosition.x,
            y: foliagePosition.y,
            type: foliageType
        })
    }

    // Skapa små grupper av samma trädtyp i stället för att sprida alla träd jämnt.
    var treeGroupCount = 3 + Math.floor(Math.random() * 4) + Math.min(3, Math.floor(depth / 5))
    for (var groupIndex = 0; groupIndex < treeGroupCount; groupIndex++) {
        var groupCenter = randomPosition()
        var treeRoll = Math.random()
        // Djupare skog byter gradvis ut friska granar mot döda och förvridna träd.
        var groupType = depth >= 9 ? treeRoll < 0.55 ? 1 : treeRoll < 0.82 ? 2 : 0 : depth >= 5 ? treeRoll < 0.4 ? 1 : treeRoll < 0.72 ? 2 : 0 : depth >= 2 ? treeRoll < 0.25 ? 1 : treeRoll < 0.55 ? 2 : 0 : Math.floor(treeRoll * 3)
        var treesInGroup = 2 + Math.floor(Math.random() * 4)
        for (var treeIndex = 0; treeIndex < treesInGroup; treeIndex++) {
            // Sprid träden kring gruppens mittpunkt så de ser ut som små skogsdungar.
            var tree = {
                x: groupCenter.x + (Math.random() - 0.5) * 86,
                y: groupCenter.y + (Math.random() - 0.5) * 70,
                type: groupType
            }
            if (tree.x > 20 && tree.x < totalWidth - 20 && tree.y > 20 && tree.y < playfieldBottom() - 20 &&
                distanceBetween(tree.x, tree.y, totalWidth / 2, totalHeight / 2) > 65 &&
                distanceBetween(tree.x, tree.y, player.x, player.y) > 55) {
                content.trees.push(tree)
            }
        }
    }

    var isFinalBossScene = scene.x === 0 && scene.y === 20
    // Svårighetsgrad och vapen räknas längs y-axeln.
    // Bestäm bosschansen en gång per y-nivå så sidledsscener delar samma resultat.
    if (bossDepths[depth] === undefined) {
        var nearbyBoss = false
        // Gå igenom redan valda bossnivåer och blockera för täta bossmöten.
        for (var checkedDepth in bossDepths) {
            if (bossDepths[checkedDepth] && Math.abs(depth - Number(checkedDepth)) < 4) {
                nearbyBoss = true
            }
        }
        // Nivå 20 är reserverad för finalbossen; övriga bossnivåer väljs slumpmässigt.
        bossDepths[depth] = depth === 20 || depth >= 5 && !nearbyBoss && Math.random() < 0.18
    }
    content.bossLevel = isFinalBossScene || depth !== 20 && bossDepths[depth]
    // Finalbossarenan får bara bossen; övriga scener följer samma fiendesvårighet som tidigare.
    var enemyCount = depth === 0 || isFinalBossScene ? 0 : content.bossLevel ? 1 + Math.floor(Math.random() * 2) : Math.min(16, 2 + depth + Math.floor(Math.random() * 3))
    for (var j = 0; j < enemyCount; j++) {
        var enemyPosition = randomEnemyPosition()
        // Nya fiendetyper låses upp gradvis: förföljare, brute och spottare.
        var availableEnemyTypes = Math.min(8, 2 + Math.floor(depth / 2))
        var enemyType = content.bossLevel ? 0 : Math.floor(Math.random() * availableEnemyTypes)
        // Varje sort har egen grundhälsa; djupet gör även gamla fiender tåligare.
        var baseHealth = enemyType === 1 ? 5 : enemyType === 2 ? 2 : enemyType === 3 ? 3 : enemyType === 4 ? 8 : enemyType === 5 ? 2 : enemyType === 6 ? 10 : enemyType === 7 ? 3 : 1
        var enemyHealth = content.bossLevel ? 1 : baseHealth + Math.floor(depth / 3)
        content.enemies.push({
            x: enemyPosition.x,
            y: enemyPosition.y,
            type: enemyType,
            hp: enemyHealth,
            maxHp: enemyHealth,
            // Små jägare springer, medan stora fiender och spottare rör sig långsamt.
            speed: enemyType === 1 ? 0.4 + Math.random() * 0.3 : enemyType === 2 || enemyType === 5 ? 1.3 + Math.random() * 0.5 : enemyType === 3 ? 0.5 + Math.random() * 0.3 : enemyType === 4 || enemyType === 6 ? 0.35 + Math.random() * 0.25 : enemyType === 7 ? 0.3 + Math.random() * 0.2 : 0.7 + Math.random() * 0.5,
            nextShotFrame: frameCount + updatesPerSecond * (2 + Math.random() * 2)
        })
    }

    // Bossen har mycket liv och blir tåligare på djupare bossnivåer.
    if (content.bossLevel) {
        var bossPosition = randomEnemyPosition()
        // Varje bossnivå väljer mellan tre silhuetter och attackmönster.
        var bossType = isFinalBossScene ? 3 : Math.floor(Math.random() * 3)
        content.boss = {
            x: isFinalBossScene ? totalWidth / 2 : bossPosition.x,
            y: isFinalBossScene ? playfieldBottom() / 2 : bossPosition.y,
            type: bossType,
            hp: isFinalBossScene ? 1200 : 120 + depth * 10,
            maxHp: isFinalBossScene ? 1200 : 120 + depth * 10,
            // Bossens första attack kommer efter sex sekunder; tiden mäts i bildrutor.
            nextDashFrame: frameCount + updatesPerSecond * 6,
            warningPlayed: false,
            isDashing: false,
            dashEndFrame: 0,
            dashX: 0,
            dashY: 0,
            nextShotFrame: frameCount + updatesPerSecond * 3,
            warningStartFrame: 0,
            attackX: 0,
            attackY: 0,
            slamHit: false,
            finalAttackMode: 0
        }
    }

    // Byggnader har 40 % chans att finnas och kan vara en eller två per scen.
    if (Math.random() < 0.4) {
        var buildingCount = 1 + Math.floor(Math.random() * 2)
        for (var buildingIndex = 0; buildingIndex < buildingCount; buildingIndex++) {
            var buildingPosition = randomPosition()
            if (distanceBetween(buildingPosition.x, buildingPosition.y, totalWidth / 2, totalHeight / 2) > 120) {
                content.buildings.push({
                    x: buildingPosition.x,
                    y: buildingPosition.y,
                    type: Math.floor(Math.random() * 4)
                })
            }
        }
    }

    // Exakt ett slumpat vapen placeras i varje scen.
    var weaponPosition = randomPosition()
    content.weapons.push({
        x: weaponPosition.x,
        y: weaponPosition.y,
        type: chooseWeapon(depth, Math.random())
    })

    // Huset är separat från dekorationerna eftersom det kan fylla på ammunition.
    if (Math.random() < 0.2) {
        var housePosition = {
            x: 100 + Math.random() * (totalWidth - 200),
            y: 100 + Math.random() * Math.max(1, playfieldBottom() - 200)
        }
        content.house = {
            x: housePosition.x,
            y: housePosition.y,
            type: Math.floor(Math.random() * 4),
            ammo: true
        }
    }

    return content
}

// Hämtar aktuell scen, och skapar den första gången spelaren besöker den.
function getCurrentScene() {
    var key = scene.x + "," + scene.y
    if (!scenes[key]) {
        scenes[key] = makeScene()
    }
    return scenes[key]
}

// Ritar en minikarta över x-scenerna och y-nivåerna som spelaren redan besökt.
function drawVisitedMap() {
    var mapX = 12
    var mapY = playfieldBottom() + 26
    var cellWidth = 7
    var cellHeight = 3

    rectangle(mapX - 5, mapY - 18, 88, 100, "dimgray")
    rectangle(mapX - 2, mapY - 15, 82, 94, "black")
    text(mapX + 2, mapY - 3, 13, "KARTA", "orange")

    // Den spelbara vägen går från startnivå 0 till finalnivå 20.
    for (var mapYLevel = 0; mapYLevel <= 20; mapYLevel++) {
        var rowY = mapY + 8 + mapYLevel * cellHeight
        for (var mapXScene = -5; mapXScene <= 5; mapXScene++) {
            var sceneKey = mapXScene + "," + mapYLevel
            if (scenes[sceneKey]) {
                var tileColor = mapXScene === scene.x && mapYLevel === scene.y ? "orange" : scenes[sceneKey].bossLevel ? "red" : "deepskyblue"
                rectangle(mapX + (mapXScene + 5) * cellWidth, rowY, cellWidth - 1, cellHeight - 1, tileColor)
            }
        }
    }

    // Markera starten och slutnivån på den positiva y-vägen.
    text(mapX + 2, mapY + 76, 9, "0 > 20", "silver")
}

// Lägger till blodstänk när en zombie träffas och ett större stänk när den dör.
function addBloodSplatter(currentScene, x, y, isDeath) {
    // En träff ger ett litet stänk; ett dödsfall ger fler och större droppar.
    var dropCount = isDeath ? 12 : 5
    currentScene.blood.push({
        x: x,
        y: y + 8,
        size: isDeath ? 7 + Math.random() * 5 : 3 + Math.random() * 3,
        color: "darkred"
    })

    for (var i = 0; i < dropCount; i++) {
        // Slumpa en vinkel och ett avstånd för att sprida blod runt träffen.
        var angle = Math.random() * Math.PI * 2
        var distance = 5 + Math.random() * (isDeath ? 35 : 18)
        currentScene.blood.push({
            x: x + Math.cos(angle) * distance,
            y: y + 8 + Math.sin(angle) * distance * 0.55,
            size: 1 + Math.random() * (isDeath ? 4 : 2),
            color: i % 2 === 0 ? "darkred" : "maroon"
        })
    }

    // Begränsa mängden blod som sparas så att långa spel inte samlar för mycket data.
    while (currentScene.blood.length > 120) {
        currentScene.blood.shift()
    }
}

// Ritar alla blodfläckar som har sparats i scenen.
function drawBlood(currentScene) {
    for (var i = 0; i < currentScene.blood.length; i++) {
        var stain = currentScene.blood[i]
        // Runda positionerna till ett rutnät så blodet ser pixligt ut.
        rectangle(Math.floor(stain.x / 3) * 3, Math.floor(stain.y / 3) * 3, stain.size * 2, stain.size, stain.color)
    }
}

// Ritar olika markdetaljer i en begränsad, mörk färgpalett.
function drawFoliage(foliage) {
    // Runda positionerna till pixelrutnätet så dekorationerna passar spelets stil.
    var x = Math.floor(foliage.x / 4) * 4
    var y = Math.floor(foliage.y / 4) * 4
    var shade = Math.floor((foliage.x + foliage.y) / 16) % 2 === 0

    if (foliage.type === "dirt") {
        // Ojämn jordfläck, bruten av små mörka pixelkanter.
        rectangle(x - 8, y, 20, 4, shade ? "saddlebrown" : "darkslategray")
        rectangle(x - 4, y - 4, 16, 4, "dimgray")
        rectangle(x - 12, y + 4, 12, 4, "darkslategray")
        rectangle(x + 8, y + 4, 8, 4, "saddlebrown")
    } else if (foliage.type === "stones") {
        // Små stenar har mörka skuggor och en pixel ljusare ovansida.
        rectangle(x - 8, y, 12, 8, "dimgray")
        rectangle(x - 4, y - 4, 8, 4, "gray")
        rectangle(x + 8, y + 4, 12, 8, "darkslategray")
        rectangle(x + 12, y, 8, 4, "dimgray")
    } else if (foliage.type === "weeds") {
        // Vissna strån sticker upp ur marken i blek olivgrön färg.
        rectangle(x, y - 8, 4, 12, "darkolivegreen")
        rectangle(x - 4, y - 12, 4, 8, "olivedrab")
        rectangle(x + 4, y - 16, 4, 12, "darkolivegreen")
        rectangle(x + 8, y - 8, 4, 8, "olivedrab")
        rectangle(x - 4, y + 4, 16, 3, "saddlebrown")
    } else if (foliage.type === "bones") {
        // Benbitar och en liten skalle dyker upp där skogen blivit farligare.
        rectangle(x - 9, y, 18, 4, "ivory")
        rectangle(x - 11, y - 3, 5, 5, "ivory")
        rectangle(x + 6, y - 3, 5, 5, "ivory")
        rectangle(x - 4, y - 7, 8, 7, "gray")
        rectangle(x - 3, y - 5, 2, 2, "black")
        rectangle(x + 1, y - 5, 2, 2, "black")
    } else if (foliage.type === "blood") {
        // Mörka pölar med små röda pixlar ger marken äldre blodspår.
        rectangle(x - 12, y, 24, 5, "maroon")
        rectangle(x - 8, y - 4, 16, 4, "darkred")
        rectangle(x - 4, y + 4, 8, 3, "red")
        rectangle(x + 12, y + 3, 4, 7, "darkred")
    } else if (foliage.type === "rune") {
        // Röda runor syns tydligare bland den mörka marken på djupare nivåer.
        rectangle(x - 8, y - 8, 4, 20, "maroon")
        rectangle(x + 4, y - 8, 4, 20, "maroon")
        rectangle(x - 4, y - 4, 8, 4, "darkred")
        rectangle(x - 4, y + 4, 8, 4, "darkred")
        rectangle(x - 1, y - 12, 3, 28, shade ? "red" : "darkred")
    } else if (foliage.type === "grave") {
        // Små lutande gravstenar gör att de djupaste scenerna känns övergivna.
        rectangle(x - 8, y - 12, 16, 16, "dimgray")
        rectangle(x - 4, y - 16, 8, 4, "gray")
        rectangle(x - 1, y - 9, 3, 10, "darkred")
        rectangle(x - 4, y - 6, 9, 3, "darkred")
        rectangle(x - 12, y + 4, 24, 4, "saddlebrown")
    } else {
        // Grästuvan får en av två dämpade nyanser för mindre upprepning.
        var grassShade = shade ? "darkolivegreen" : "olivedrab"
        rectangle(x, y, 4, 3, grassShade)
        rectangle(x - 4, y - 4, 4, 4, grassShade)
        rectangle(x + 4, y - 5, 4, 5, "forestgreen")
        rectangle(x, y - 8, 4, 4, "olivedrab")
    }
}

// Ritar den röda månen, bildrader och slumpmässiga störningar i kanterna.
function drawAtmosphere(depth) {
    var darkness = Math.min(5, Math.floor(depth / 3))
    // Månen byggs av rektanglar för att passa spelets pixelutseende.
    rectangle(totalWidth - 102, 44, 64, 32, darkness >= 3 ? "maroon" : "darkred")
    rectangle(totalWidth - 94, 36, 48, 48, darkness >= 4 ? "maroon" : "darkred")
    rectangle(totalWidth - 78, 36, 32, 8, "black")
    rectangle(totalWidth - 46, 44, 8, 24, "black")
    rectangle(totalWidth - 86, 56, 8, 8, "maroon")
    rectangle(totalWidth - 66, 68, 8, 8, "maroon")

    // Tunna horisontella rader ger skärmen en gammal CRT-/scanline-känsla.
    for (var y = 8; y < totalHeight; y += 12) {
        rectangle(0, y, totalWidth, 1, "darkslategray")
    }

    // Ju djupare spelaren går, desto fler bildstörningar bryter igenom mörkret.
    var staticCount = 5 + Math.min(12, Math.floor(depth / 2))
    var staticChance = Math.min(0.8, 0.35 + depth * 0.035)
    for (var i = 0; i < staticCount; i++) {
        if (Math.random() < staticChance) {
            var staticX = Math.random() < 0.5 ? Math.random() * 45 : totalWidth - Math.random() * 45
            var staticY = Math.random() * totalHeight
            rectangle(Math.floor(staticX / 4) * 4, Math.floor(staticY / 4) * 4, 4 + Math.floor(Math.random() * 8), 4, "dimgray")
        }
    }

    // Röda glitchränder tillkommer gradvis på de djupaste nivåerna.
    var redGlitchCount = Math.min(6, Math.floor(depth / 3))
    for (var glitch = 0; glitch < redGlitchCount; glitch++) {
        if (Math.random() < 0.18 + Math.min(0.35, depth * 0.015)) {
            var glitchY = Math.floor(Math.random() * totalHeight / 4) * 4
            var glitchX = Math.floor(Math.random() * totalWidth / 8) * 8
            rectangle(glitchX, glitchY, 30 + Math.random() * 110, 3, glitch % 2 === 0 ? "darkred" : "maroon")
        }
    }
}

// Visar en kort bildstörning med jämna mellanrum för en flimrig skräckeffekt.
function drawScreenFlicker() {
    // 240 bildrutor motsvarar ungefär fyra sekunder vid 60 uppdateringar per sekund.
    if (frameCount % 240 < 2) {
        var flickerY = 100 + Math.random() * (totalHeight - 200)
        rectangle(0, flickerY, totalWidth, 3, "darkred")
        rectangle(Math.random() * totalWidth / 2, flickerY + 4, totalWidth / 3, 1, "dimgray")
    }
}

// Ritar en zombie. Typen bestämmer färg, storlek och kroppsdetaljer.
function drawEnemy(enemy) {
    // Fiendens typ väljer färg, storlek och ögon innan kroppen ritas.
    var x = enemy.x
    var y = enemy.y
    var bodyColor = enemy.type === 0 ? "darkseagreen" : enemy.type === 1 ? "dimgray" : enemy.type === 2 ? "darkred" : enemy.type === 3 ? "olivedrab" : enemy.type === 5 ? "maroon" : enemy.type === 6 ? "saddlebrown" : enemy.type === 7 ? "darkgreen" : "purple"
    var size = enemy.type === 1 || enemy.type === 6 ? 13 : enemy.type === 2 || enemy.type === 5 ? 7 : enemy.type === 4 ? 16 : enemy.type === 7 ? 11 : 9
    var eyeColor = (frameCount + enemy.type * 13) % 90 < 58 ? "red" : "maroon"

    rectangle(x - size, y - 20, size * 2, 16, bodyColor)
    rectangle(x - size / 2, y - 4, size, size + 5, bodyColor)
    rectangle(x - size, y + 2, 5, 3, "darkred")
    rectangle(x - 5, y - 14, 4, 4, eyeColor)
    rectangle(x + 2, y - 14, 4, 4, eyeColor)
    rectangle(x - 7, y + 1, 5, 3, "darkred")

    if (enemy.type === 0) {
        rectangle(x - 11, y - 5, 9, 3, bodyColor)
        rectangle(x + 2, y - 7, 10, 3, bodyColor)
    } else if (enemy.type === 1) {
        rectangle(x - size - 4, y - 23, size * 2 + 8, 6, "gray")
        rectangle(x - 5, y - 14, 4, 4, "red")
        rectangle(x + 2, y - 14, 4, 4, "red")
        rectangle(x - 10, y + 7, 20, 4, "darkred")
    } else if (enemy.type === 2) {
        rectangle(x - 2, y - 19, 3, 7, "ivory")
        rectangle(x + 3, y - 18, 3, 6, "ivory")
        rectangle(x - 13, y - 3, 11, 3, bodyColor)
        rectangle(x + 2, y - 3, 12, 3, bodyColor)
    } else if (enemy.type === 3) {
        rectangle(x - 11, y - 14, 4, 3, "ivory")
        rectangle(x + 7, y - 14, 4, 3, "ivory")
        rectangle(x - 5, y - 5, 10, 2, "darkred")
    } else if (enemy.type === 4) {
        rectangle(x - size - 4, y - 25, size * 2 + 8, 9, "maroon")
        rectangle(x - 15, y - 7, 30, 18, bodyColor)
        rectangle(x - 12, y + 8, 8, 8, "gray")
        rectangle(x + 4, y + 8, 8, 8, "gray")
        rectangle(x - 8, y - 16, 6, 6, "yellow")
        rectangle(x + 3, y - 16, 6, 6, "yellow")
    } else if (enemy.type === 5) {
        // Den hukande förföljaren är liten, snabb och har lysande ögon.
        rectangle(x - 11, y - 13, 22, 11, "maroon")
        rectangle(x - 8, y - 5, 7, 10, "darkred")
        rectangle(x + 2, y - 5, 7, 10, "darkred")
        rectangle(x - 7, y - 12, 4, 4, "orange")
        rectangle(x + 3, y - 12, 4, 4, "orange")
        rectangle(x - 15, y - 4, 7, 4, "maroon")
        rectangle(x + 8, y - 4, 9, 4, "maroon")
    } else if (enemy.type === 6) {
        // Den bepansrade bruten har platt huvud, tunga axlar och en stor käft.
        rectangle(x - 18, y - 24, 36, 12, "dimgray")
        rectangle(x - 22, y - 12, 44, 22, "saddlebrown")
        rectangle(x - 17, y + 7, 12, 11, "darkslategray")
        rectangle(x + 5, y + 7, 12, 11, "darkslategray")
        rectangle(x - 11, y - 18, 7, 5, "red")
        rectangle(x + 4, y - 18, 7, 5, "red")
        rectangle(x - 8, y - 3, 16, 6, "black")
        rectangle(x - 5, y - 3, 3, 5, "ivory")
        rectangle(x + 2, y - 3, 3, 5, "ivory")
        rectangle(x - 24, y - 9, 7, 14, "gray")
        rectangle(x + 17, y - 9, 7, 14, "gray")
    } else if (enemy.type === 7) {
        // Spottaren har en lysande säck som avslöjar dess avståndsattack.
        rectangle(x - 13, y - 20, 26, 24, "darkgreen")
        rectangle(x - 9, y - 25, 18, 9, "olivedrab")
        rectangle(x - 6, y - 13, 4, 4, "orange")
        rectangle(x + 3, y - 13, 4, 4, "orange")
        rectangle(x - 5, y - 2, 11, 5, "black")
        rectangle(x - 7, y + 4, 5, 10, "dimgray")
        rectangle(x + 3, y + 4, 5, 10, "dimgray")
        rectangle(x - 3, y - 24, 6, 4, "lime")
    }

    // Livmätaren krymper när zombien skadas.
    rectangle(x - 10, y - 25, 20, 3, "darkred")
    rectangle(x - 10, y - 25, 20 * enemy.hp / enemy.maxHp, 3, "red")
}

// Ritar spelarens vapen i rätt riktning så det syns vad karaktären håller i.
function drawHeldWeapon(x, y, facing) {
    // Utan ett valt vapen ska inga vapendelar ritas i spelarens hand.
    if (!player.weapon) return

    if (facing === "left" || facing === "right") {
        // Horisontella vapen ritas åt vänster eller höger beroende på riktningen.
        var direction = facing === "right" ? 1 : -1
        var gunColor = player.weapon === "rocket" || player.weapon === "flame" ? "olivedrab" : player.weapon === "shotgun" || player.weapon === "revolver" ? "saddlebrown" : player.weapon === "smg" ? "deepskyblue" : "silver"
        var gunAccent = player.weapon === "rocket" || player.weapon === "flame" ? "orange" : player.weapon === "shotgun" || player.weapon === "revolver" ? "gold" : player.weapon === "smg" ? "yellow" : "deepskyblue"
        var gunLength = player.weapon === "rocket" || player.weapon === "flame" ? 24 : player.weapon === "rifle" ? 28 : player.weapon === "shotgun" ? 22 : player.weapon === "revolver" ? 16 : player.weapon === "smg" ? 17 : 12
        var handX = direction > 0 ? x + 7 : x - 12
        var gunX = direction > 0 ? x + 12 : x - 12 - gunLength
        rectangle(handX, y - 9, 6, 8, "saddlebrown")
        rectangle(gunX - 2, y - 10, gunLength + 4, 9, "black")
        rectangle(gunX, y - 8, gunLength, 5, gunColor)
        rectangle(gunX + (direction > 0 ? gunLength - 3 : 1), y - 8, 3, 5, gunAccent)
        if (player.weapon === "smg") rectangle(gunX + 4, y - 3, 5, 7, "dimgray")
        if (player.weapon === "shotgun") rectangle(gunX + 5, y - 2, 8, 3, "gold")
        if (player.weapon === "rocket") rectangle(gunX + 5, y - 12, 10, 3, "orange")
        if (player.weapon === "revolver") rectangle(gunX + 3, y - 11, 7, 4, "gold")
        if (player.weapon === "rifle") rectangle(gunX + 8, y - 12, 9, 3, "deepskyblue")
        if (player.weapon === "flame") rectangle(gunX + gunLength - 2, y - 9, 8, 7, "orange")
    } else {
        // Vertikala vapen riktas uppåt eller nedåt.
        var verticalDirection = facing === "up" ? -1 : 1
        var gunColorVertical = player.weapon === "rocket" || player.weapon === "flame" ? "olivedrab" : player.weapon === "shotgun" || player.weapon === "revolver" ? "saddlebrown" : player.weapon === "smg" ? "deepskyblue" : "silver"
        var gunAccentVertical = player.weapon === "rocket" || player.weapon === "flame" ? "orange" : player.weapon === "shotgun" || player.weapon === "revolver" ? "gold" : player.weapon === "smg" ? "yellow" : "deepskyblue"
        var gunLengthVertical = player.weapon === "rocket" || player.weapon === "flame" ? 24 : player.weapon === "rifle" ? 28 : player.weapon === "shotgun" ? 22 : player.weapon === "revolver" ? 16 : player.weapon === "smg" ? 17 : 12
        rectangle(x + 5, y - 5, 6, 5, "saddlebrown")
        var gunY = verticalDirection < 0 ? y - 5 - gunLengthVertical : y
        rectangle(x + 4, gunY - 2, 10, gunLengthVertical + 4, "black")
        rectangle(x + 7, gunY, 5, gunLengthVertical, gunColorVertical)
        rectangle(x + 7, verticalDirection < 0 ? gunY : gunY + gunLengthVertical - 3, 5, 3, gunAccentVertical)
        if (player.weapon === "smg") rectangle(x + 2, gunY + 5, 7, 5, "dimgray")
        if (player.weapon === "shotgun") rectangle(x + 12, gunY + 5, 3, 8, "gold")
        if (player.weapon === "rocket") rectangle(x + 4, gunY + 5, 11, 4, "orange")
        if (player.weapon === "revolver") rectangle(x + 12, gunY + 4, 5, 6, "gold")
        if (player.weapon === "rifle") rectangle(x + 2, gunY + 8, 4, 8, "saddlebrown")
        if (player.weapon === "flame") rectangle(x + 4, gunY + gunLengthVertical - 2, 11, 7, "orange")
    }
}

// Ritar spelarens pixelkaraktär vänd åt det håll den senast gick.
function drawPlayer() {
    // Flimra vid träff så skadan blir synlig utan att spelaren försvinner permanent.
    if (frameCount < player.invulnerableUntil && Math.floor(frameCount / 5) % 2 === 0) return
    // Koordinaterna rundas till närmaste 3-pixelssteg för en grov pixelstil.
    var x = Math.floor(player.x / 3) * 3
    var y = Math.floor(player.y / 3) * 3
    var walking = keyboard.a || keyboard.d || keyboard.w || keyboard.s
    var legOffset = walking && frameCount % 12 < 6 ? 2 : 0

    // Blå jacka, mörkblå skuggor, axlar och bälte ger karaktären en tydlig kropp.
    rectangle(x - 12, y - 17, 5, 13, "darkblue")
    rectangle(x - 9, y - 19, 18, 16, "blue")
    rectangle(x - 7, y - 17, 14, 3, "deepskyblue")
    rectangle(x - 2, y - 15, 4, 9, "navy")
    rectangle(x - 9, y - 5, 18, 3, "darkblue")
    rectangle(x - 6, y - 4, 12, 4, "silver")
    rectangle(x - 6, y - 25, 12, 6, "saddlebrown")
    rectangle(x - 8, y - 22, 16, 4, "saddlebrown")
    rectangle(x - 8, y - 20, 16, 3, "dimgray")

    // Ansiktet och ögonen vrids mot spelarens rörelseriktning.
    if (player.facing === "down") {
        rectangle(x - 5, y - 18, 3, 3, "red")
        rectangle(x + 2, y - 18, 3, 3, "red")
        rectangle(x - 2, y - 15, 4, 2, "black")
    } else if (player.facing === "left") {
        rectangle(x - 9, y - 18, 3, 4, "red")
        rectangle(x - 8, y - 13, 4, 2, "black")
    } else if (player.facing === "right") {
        rectangle(x + 6, y - 18, 3, 4, "red")
        rectangle(x + 4, y - 13, 4, 2, "black")
    } else {
        rectangle(x - 6, y - 21, 12, 3, "saddlebrown")
        rectangle(x - 3, y - 17, 6, 2, "black")
    }

    // Blå armar sitter vid axlarna; händerna och benen syns tydligt runt kroppen.
    rectangle(x - 14, y - 15, 5, 10, "blue")
    rectangle(x - 14, y - 6, 5, 4, "saddlebrown")
    rectangle(x + 9, y - 15, 5, 10, "blue")
    rectangle(x + 9, y - 6, 5, 4, "saddlebrown")
    rectangle(x - 8, y - 2, 6, 10 + legOffset, "darkblue")
    rectangle(x + 2, y - 2, 6, 10 + (walking ? 2 - legOffset : 0), "darkblue")
    rectangle(x - 9, y + 7 + legOffset, 7, 3, "black")
    rectangle(x + 1, y + 7 + (walking ? 2 - legOffset : 0), 7, 3, "black")
    drawHeldWeapon(x, y, player.facing)
}

// Lägger ammunition i rätt förråd och uppdaterar aktuell ammunition om vapnet hålls.
function addAmmo(weapon, amount) {
    // Lägg ammunition i just det vapnets förråd; uppdatera även aktuell ammo om vapnet hålls.
    if (weapon === "revolver") {
        player.revolverAmmo += amount
        if (player.weapon === "revolver") player.ammo = player.revolverAmmo
    } else if (weapon === "rifle") {
        player.rifleAmmo += amount
        if (player.weapon === "rifle") player.ammo = player.rifleAmmo
    } else if (weapon === "flame") {
        player.flameAmmo += amount
        if (player.weapon === "flame") player.ammo = player.flameAmmo
    } else if (weapon === "shotgun") {
        player.shotgunAmmo += amount
        if (player.weapon === "shotgun") {
            player.ammo = player.shotgunAmmo
        }
    } else if (weapon === "smg") {
        player.smgAmmo += amount
        if (player.weapon === "smg") {
            player.ammo = player.smgAmmo
        }
    } else if (weapon === "rocket") {
        player.rocketAmmo += amount
        if (player.weapon === "rocket") {
            player.ammo = player.rocketAmmo
        }
    } else {
        player.pistolAmmo += amount
        if (player.weapon === "pistol") {
            player.ammo = player.pistolAmmo
        }
    }
}

// Hämtar ammunitionen som finns kvar för en viss vapentyp.
function ammoForWeapon(weapon) {
    // Returnera rätt reserv så vapenbyte kan hitta skott utan att blanda vapentyper.
    if (weapon === "revolver") return player.revolverAmmo
    if (weapon === "rifle") return player.rifleAmmo
    if (weapon === "flame") return player.flameAmmo
    if (weapon === "rocket") return player.rocketAmmo
    if (weapon === "smg") return player.smgAmmo
    if (weapon === "shotgun") return player.shotgunAmmo
    if (weapon === "pistol") return player.pistolAmmo
    return 0
}

// Sparar aktuell ammunition i förrådet för det vapen som just sköt.
function setWeaponAmmo(weapon, amount) {
    if (weapon === "revolver") player.revolverAmmo = amount
    else if (weapon === "rifle") player.rifleAmmo = amount
    else if (weapon === "flame") player.flameAmmo = amount
    else if (weapon === "rocket") player.rocketAmmo = amount
    else if (weapon === "smg") player.smgAmmo = amount
    else if (weapon === "shotgun") player.shotgunAmmo = amount
    else if (weapon === "pistol") player.pistolAmmo = amount
}

// Byter automatiskt till nästa vapen med skott kvar, eller lämnar spelaren obeväpnad.
function switchToAvailableWeapon() {
    // Prioritera kraftigare vapen; byt till första vapnet i listan som har skott kvar.
    var choices = ["rocket", "flame", "rifle", "smg", "shotgun", "revolver", "pistol"]
    for (var i = 0; i < choices.length; i++) {
        if (ammoForWeapon(choices[i]) > 0) {
            player.weapon = choices[i]
            player.ammo = ammoForWeapon(choices[i])
            return
        }
    }
    player.weapon = null
    player.ammo = 0
}

// Q växlar mellan de vapen som redan har ammunition kvar.
function cycleWeapon() {
    var choices = ["pistol", "revolver", "shotgun", "smg", "rifle", "flame", "rocket"]
    var currentIndex = -1
    for (var index = 0; index < choices.length; index++) {
        if (choices[index] === player.weapon) currentIndex = index
    }
    for (var step = 1; step <= choices.length; step++) {
        var nextWeapon = choices[(currentIndex + step) % choices.length]
        if (selectWeapon(nextWeapon)) return
    }
}

// Väljer en viss slot direkt när den innehåller ammunition.
function selectWeapon(weapon) {
    if (ammoForWeapon(weapon) <= 0 || player.weapon === weapon) return false
    player.weapon = weapon
    player.ammo = ammoForWeapon(weapon)
    playSound("pickup")
    return true
}

// Huset fyller på varje vapens förråd utan att ta bort ammunition som redan finns.
function restockAllAmmo() {
    // Math.max behåller ett större befintligt förråd och fyller bara upp till miniminivån.
    player.pistolAmmo = Math.max(player.pistolAmmo, 32)
    player.shotgunAmmo = Math.max(player.shotgunAmmo, 16)
    player.smgAmmo = Math.max(player.smgAmmo, 120)
    player.rocketAmmo = Math.max(player.rocketAmmo, 6)
    player.revolverAmmo = Math.max(player.revolverAmmo, 30)
    player.rifleAmmo = Math.max(player.rifleAmmo, 60)
    player.flameAmmo = Math.max(player.flameAmmo, 100)
    if (player.weapon) {
        player.ammo = ammoForWeapon(player.weapon)
    } else {
        switchToAvailableWeapon()
    }
}

// Mängden ammunition som ett vapen ger när det hittas eller i ett hus.
function ammoPickupAmount(weapon, fromHouse) {
    // Hus ger större påfyllning än enstaka vapen som hittas ute på marken.
    if (weapon === "revolver") return fromHouse ? 30 : 12
    if (weapon === "rifle") return fromHouse ? 60 : 24
    if (weapon === "flame") return fromHouse ? 100 : 40
    if (weapon === "rocket") return fromHouse ? 2 : 3
    if (weapon === "smg") return fromHouse ? 60 : 45
    if (weapon === "shotgun") return fromHouse ? 24 : 8
    return fromHouse ? 26 : 16
}

// Gör vapnens interna namn lättare att förstå i gränssnittet.
function weaponName(weapon) {
    // Översätt interna kortnamn till text som spelaren förstår.
    if (weapon === "revolver") return "Revolver"
    if (weapon === "rifle") return "Gevär"
    if (weapon === "flame") return "Eldkastare"
    if (weapon === "rocket") return "Raketkastare"
    if (weapon === "smg") return "SMG"
    if (weapon === "shotgun") return "Hagelgevär"
    if (weapon === "pistol") return "Pistol"
    return "Inget vapen"
}

// Visar alla vapenslots längst ned och markerar vilka som har ammunition.
function drawWeaponHotbar() {
    var weapons = ["pistol", "revolver", "shotgun", "smg", "rifle", "flame", "rocket"]
    var labels = ["PISTOL", "REV", "HAGEL", "SMG", "GEVÄR", "ELD", "RAKET"]
    var colors = ["white", "gold", "gold", "deepskyblue", "deepskyblue", "orange", "orange"]
    var slotWidth = 70
    var slotHeight = 52
    var gap = 5
    var barWidth = weapons.length * slotWidth + (weapons.length - 1) * gap
    var startX = (totalWidth - barWidth) / 2
    var startY = playfieldBottom() + 70

    for (var slot = 0; slot < weapons.length; slot++) {
        var slotX = startX + slot * (slotWidth + gap)
        var available = ammoForWeapon(weapons[slot]) > 0
        var selected = player.weapon === weapons[slot]
        rectangle(slotX, startY, slotWidth, slotHeight, selected ? "orange" : available ? "dimgray" : "darkslategray")
        rectangle(slotX + 2, startY + 2, slotWidth - 4, slotHeight - 4, selected ? "maroon" : "black")
        rectangle(slotX + 4, startY + 4, slotWidth - 8, 3, selected ? "yellow" : available ? "dimgray" : "black")
        text(slotX + 7, startY + 17, 12, String(slot + 1), selected ? "yellow" : "silver")
        text(slotX + 20, startY + 25, 12, labels[slot], available ? colors[slot] : "dimgray")
        text(slotX + 8, startY + 44, 11, available ? "AMMO " + ammoForWeapon(weapons[slot]) : "---", available ? "lime" : "gray")
    }
}

    var staminaX = statsX + statsWidth * 0.84

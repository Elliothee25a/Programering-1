// Var femte zombiedöd ger ett liv; vid fulla liv blir belöningen i stället en sköld.
function rewardForEnemyKill() {
    player.killsTowardReward += 1
    if (player.killsTowardReward < 5) return

    player.killsTowardReward = 0
    if (player.lives < 3) {
        player.lives += 1
    } else if (player.shields < 3) {
        player.shields += 1
    } else {
        return
    }
    playSound("pickup")
}

// Skadar en zombie och delar ut poäng och belöning om träffen besegrar den.
function damageZombie(currentScene, enemy, damage) {
    // Skada dras från livmätaren; funktionen returnerar true om zombien besegras.
    enemy.hp -= damage
    addBloodSplatter(currentScene, enemy.x, enemy.y, enemy.hp <= 0)
    playSound(enemy.hp <= 0 ? "kill" : "hit")
    if (enemy.hp <= 0) {
        score += enemy.type === 6 ? 120 : enemy.type === 7 ? 75 : enemy.type === 5 ? 60 : enemy.type === 4 ? 100 : enemy.type === 1 ? 50 : enemy.type === 2 ? 30 : enemy.type === 3 ? 40 : 20
        rewardForEnemyKill()
        return true
    }
    return false
}

// Skadar bossen; bossens träffar ger extra poäng när den besegras.
function damageBoss(currentScene, damage) {
    // En besegrad boss ger 500 poäng och kan inte skadas igen.
    if (!currentScene.boss || currentScene.boss.hp <= 0) return false
    currentScene.boss.hp -= damage
    addBloodSplatter(currentScene, currentScene.boss.x, currentScene.boss.y, currentScene.boss.hp <= 0)
    playSound(currentScene.boss.hp <= 0 ? "bossDeath" : "bossHit")
    if (currentScene.boss.hp <= 0) {
        currentScene.boss.hp = 0
        score += 500
        if (currentScene.boss.type === 3 && scene.x === 0 && scene.y === 20) {
            triggerVictory()
        }
        return true
    }
    return false
}

// Skapar en synlig fiendeprojektil riktad mot spelarens position.
function addEnemyShot(currentScene, x, y, targetX, targetY, speed, damage, spread, color) {
    var angle = Math.atan2(targetY - y, targetX - x) + (spread || 0)
    currentScene.enemyShots.push({
        x: x,
        y: y,
        speedX: Math.cos(angle) * speed,
        speedY: Math.sin(angle) * speed,
        damage: damage,
        color: color || "lime",
        distance: 0
    })
}

// Ger bossen ett namn för HUD:en och dess separata utseende.
function bossName(type) {
    if (type === 1) return "GIFTSPOTTER"
    if (type === 2) return "MARKSLAGAREN"
    if (type === 3) return "DEN SISTA"
    return "VÄGSLUKAREN"
}

// Ritar den stora bossen och dess separata livmätare.
function drawBoss(boss) {
    var enraged = boss.hp <= boss.maxHp / 2
    var bodyColor = enraged ? "red" : boss.type === 1 ? "darkgreen" : boss.type === 2 ? "dimgray" : "darkred"
    var eyeColor = enraged ? "orange" : boss.type === 1 ? "lime" : "yellow"

    if (boss.type === 1) {
        // Giftspotterns spindelliknande kropp och lysande giftsäck skiljer den från de andra bossarna.
        rectangle(boss.x - 27, boss.y - 35, 54, 18, "darkolivegreen")
        rectangle(boss.x - 24, boss.y - 17, 48, 37, bodyColor)
        rectangle(boss.x - 18, boss.y - 42, 36, 13, "lime")
        rectangle(boss.x - 12, boss.y - 39, 6, 5, "black")
        rectangle(boss.x + 6, boss.y - 39, 6, 5, "black")
        rectangle(boss.x - 39, boss.y - 10, 15, 5, "olivedrab")
        rectangle(boss.x + 24, boss.y - 10, 15, 5, "olivedrab")
        rectangle(boss.x - 34, boss.y + 7, 17, 5, "darkgreen")
        rectangle(boss.x + 17, boss.y + 7, 17, 5, "darkgreen")
        rectangle(boss.x - 10, boss.y + 8, 20, 8, "black")
        rectangle(boss.x - 4, boss.y + 8, 4, 5, "lime")
    } else if (boss.type === 2) {
        // Markslagarens breda stenkropp och lysande runor varnar för dess markattack.
        rectangle(boss.x - 40, boss.y - 40, 80, 26, "black")
        rectangle(boss.x - 34, boss.y - 34, 68, 56, bodyColor)
        rectangle(boss.x - 28, boss.y - 20, 18, 18, "darkslategray")
        rectangle(boss.x + 10, boss.y - 20, 18, 18, "darkslategray")
        rectangle(boss.x - 18, boss.y - 16, 10, 10, eyeColor)
        rectangle(boss.x + 8, boss.y - 16, 10, 10, eyeColor)
        rectangle(boss.x - 13, boss.y + 1, 26, 7, "black")
        rectangle(boss.x - 6, boss.y + 1, 5, 6, "ivory")
        rectangle(boss.x + 2, boss.y + 1, 5, 6, "ivory")
        rectangle(boss.x - 30, boss.y + 22, 20, 15, "dimgray")
        rectangle(boss.x + 10, boss.y + 22, 20, 15, "dimgray")
        rectangle(boss.x - 43, boss.y - 23, 12, 25, "saddlebrown")
        rectangle(boss.x + 31, boss.y - 23, 12, 25, "saddlebrown")
    } else if (boss.type === 3) {
        // Finalbossen är flera gånger större och har ett torn av kroppar med glödande kärna.
        var finalScale = enraged ? 1.08 : 1
        rectangle(boss.x - 72 * finalScale, boss.y - 82 * finalScale, 144 * finalScale, 58 * finalScale, "black")
        rectangle(boss.x - 60 * finalScale, boss.y - 70 * finalScale, 120 * finalScale, 52 * finalScale, "maroon")
        rectangle(boss.x - 47 * finalScale, boss.y - 34 * finalScale, 94 * finalScale, 94 * finalScale, bodyColor)
        rectangle(boss.x - 62 * finalScale, boss.y + 42 * finalScale, 42 * finalScale, 36 * finalScale, "dimgray")
        rectangle(boss.x + 20 * finalScale, boss.y + 42 * finalScale, 42 * finalScale, 36 * finalScale, "dimgray")
        rectangle(boss.x - 105 * finalScale, boss.y - 28 * finalScale, 52 * finalScale, 22 * finalScale, "darkred")
        rectangle(boss.x + 53 * finalScale, boss.y - 28 * finalScale, 52 * finalScale, 22 * finalScale, "darkred")
        rectangle(boss.x - 34 * finalScale, boss.y - 20 * finalScale, 20 * finalScale, 18 * finalScale, eyeColor)
        rectangle(boss.x + 14 * finalScale, boss.y - 20 * finalScale, 20 * finalScale, 18 * finalScale, eyeColor)
        rectangle(boss.x - 23 * finalScale, boss.y + 14 * finalScale, 46 * finalScale, 13 * finalScale, "black")
        rectangle(boss.x - 15 * finalScale, boss.y + 14 * finalScale, 8 * finalScale, 11 * finalScale, "ivory")
        rectangle(boss.x + 7 * finalScale, boss.y + 14 * finalScale, 8 * finalScale, 11 * finalScale, "ivory")
        rectangle(boss.x - 24 * finalScale, boss.y - 51 * finalScale, 48 * finalScale, 18 * finalScale, "orange")
        rectangle(boss.x - 14 * finalScale, boss.y - 47 * finalScale, 28 * finalScale, 10 * finalScale, "yellow")
        rectangle(boss.x - 28 * finalScale, boss.y - 100 * finalScale, 56 * finalScale, 18 * finalScale, "dimgray")
        rectangle(boss.x - 15 * finalScale, boss.y - 116 * finalScale, 30 * finalScale, 18 * finalScale, "maroon")
    } else {
        // Vägslukaren behåller den ursprungliga bossens stora röda kropp och gula ögon.
        rectangle(boss.x - 31, boss.y - 48, 62, 30, "maroon")
        rectangle(boss.x - 28, boss.y - 18, 56, 50, bodyColor)
        rectangle(boss.x - 24, boss.y + 17, 15, 16, "dimgray")
        rectangle(boss.x + 9, boss.y + 17, 15, 16, "dimgray")
        rectangle(boss.x - 16, boss.y - 26, 10, 10, eyeColor)
        rectangle(boss.x + 6, boss.y - 26, 10, 10, eyeColor)
        rectangle(boss.x - 14, boss.y - 7, 28, 4, "black")
    }

    var healthBarWidth = boss.type === 3 ? 200 : 84
    var healthBarX = boss.x - healthBarWidth / 2
    var healthBarY = boss.y - (boss.type === 3 ? 136 : 62)
    rectangle(healthBarX, healthBarY, healthBarWidth, 9, "dimgray")
    rectangle(healthBarX, healthBarY, healthBarWidth * boss.hp / boss.maxHp, 9, boss.type === 3 ? "orange" : "red")
}

// Ger varje bossnivå en egen färg och finalarenan en mörk, glödande spricka.
function drawBossArena(bossType) {
    var arenaColor = bossType === 1 ? "darkgreen" : bossType === 2 ? "dimgray" : bossType === 3 ? "black" : "darkred"
    rectangle(0, 0, totalWidth, totalHeight, arenaColor)
    for (var y = 145; y < totalHeight; y += 90) {
        rectangle(0, y, totalWidth, 3, bossType === 1 ? "darkolivegreen" : bossType === 2 ? "darkslategray" : "maroon")
    }
    rectangle(0, totalHeight - 55, totalWidth, 5, "black")
    if (bossType === 3) {
        rectangle(totalWidth / 2 - 8, 0, 16, totalHeight, "darkred")
        rectangle(totalWidth / 2 - 3, 0, 6, totalHeight, "red")
        text(totalWidth / 2 - 115, 35, 26, "FINALBOSS - NIVÅ 20", "orange")
    } else {
        text(totalWidth / 2 - 65, 35, 26, bossName(bossType), bossType === 1 ? "lime" : bossType === 2 ? "silver" : "red")
    }
}

// Ritar en kort röd blixt och ett växande, pixligt blodstänk över dödsskärmen.
function drawDeathScreen() {
    var deathAge = frameCount - deathFrame

    // De första bildrutorna blixtrar rött innan skärmen faller tillbaka till mörker.
    if (deathAge < 7) {
        rectangle(0, 0, totalWidth, totalHeight, deathAge % 2 === 0 ? "red" : "darkred")
    } else {
        rectangle(0, 0, totalWidth, totalHeight, "black")
        for (var stripeY = 0; stripeY < totalHeight; stripeY += 24) {
            rectangle(0, stripeY, totalWidth, 3, "darkred")
        }
    }

    // Ojämna röda rutor bildar ett blodstänk som sprider sig ut från mitten.
    var spread = Math.min(totalWidth, totalHeight, deathAge * 7)
    for (var blot = 0; blot < 18; blot++) {
        var blotX = totalWidth / 2 + Math.sin(blot * 91) * spread * (0.35 + (blot % 4) * 0.12)
        var blotY = totalHeight / 2 + Math.cos(blot * 47) * spread * (0.3 + (blot % 3) * 0.15)
        var blotSize = 8 + (blot % 5) * 5
        rectangle(blotX, blotY, blotSize, blotSize, blot % 3 === 0 ? "maroon" : "darkred")
        rectangle(blotX + 3, blotY + 3, Math.max(3, blotSize / 2), Math.max(3, blotSize / 2), "red")
    }

    // Blodränderna rinner ned från skärmens överkant under den första sekunden.
    var dripLength = Math.min(totalHeight * 0.65, Math.max(0, deathAge - 4) * 3)
    for (var drip = 0; drip < 13; drip++) {
        var dripX = (drip * 83 + 19) % totalWidth
        var dripWidth = 5 + (drip % 4) * 3
        var dripOffset = (drip * 17) % 38
        var currentDripLength = Math.max(0, dripLength - dripOffset)
        if (currentDripLength > 0) {
            rectangle(dripX, 0, dripWidth + 5, Math.min(12, currentDripLength), "maroon")
            rectangle(dripX + 3, 8, dripWidth, currentDripLength, "darkred")
            rectangle(dripX + 2, currentDripLength + 4, dripWidth + 2, 7, "red")
        }
    }

    // Slutresultatet får en mörk ram ovanpå effekten så texten förblir lättläst.
    rectangle(totalWidth / 2 - 205, totalHeight / 2 - 94, 410, 182, "maroon")
    rectangle(totalWidth / 2 - 198, totalHeight / 2 - 87, 396, 168, "black")
    text(totalWidth / 2 - 125, totalHeight / 2 - 53, 36, "DU DOG...", "red")
    text(totalWidth / 2 - 116, totalHeight / 2 - 13, 22, "SLUTPOÄNG: " + score, "white")
    text(totalWidth / 2 - 162, totalHeight / 2 + 17, 18, "NIVÅ " + deathLevel + "  |  ÖVERLEVDE: " + Math.floor(deathFrame / updatesPerSecond) + " SEK", "silver")
    if (deathAge < 90) {
        text(totalWidth / 2 - 123, totalHeight / 2 + 48, 15, "NÅGOT FÖLJDE MED DIG...", "darkred")
    }
}

// Visar en tydlig segerbild efter att finalbossen har besegrats.
function drawVictoryScreen() {
    var victoryAge = frameCount - victoryFrame
    rectangle(0, 0, totalWidth, totalHeight, "black")
    for (var glow = 0; glow < 8; glow++) {
        var glowWidth = totalWidth - glow * 36
        rectangle((totalWidth - glowWidth) / 2, 45 + glow * 23, glowWidth, 4, glow % 2 === 0 ? "darkred" : "maroon")
        rectangle((totalWidth - glowWidth) / 2, totalHeight - 49 - glow * 23, glowWidth, 4, glow % 2 === 0 ? "darkred" : "maroon")
    }
    rectangle(totalWidth / 2 - 220, totalHeight / 2 - 105, 440, 210, "maroon")
    rectangle(totalWidth / 2 - 212, totalHeight / 2 - 97, 424, 194, "black")
    text(totalWidth / 2 - 150, totalHeight / 2 - 59, 38, "DU ÖVERLEVDE", "orange")
    text(totalWidth / 2 - 149, totalHeight / 2 - 15, 21, "FINALBOSSEN ÄR BESEGRAD", "white")
    text(totalWidth / 2 - 125, totalHeight / 2 + 22, 18, "SLUTPOÄNG: " + score, "deepskyblue")
    text(totalWidth / 2 - 143, totalHeight / 2 + 53, 16, "DU KLARADE NIVÅ 20", "lime")
    if (victoryAge < updatesPerSecond * 3) {
        text(totalWidth / 2 - 100, totalHeight / 2 + 79, 13, "SKOGEN HAR TYSTNAT...", "silver")
    }
}

// Lägger en blodig kant över skärmen efter träff; färre och mörkare fläckar tonar bort effekten.
function drawHitOverlay() {
    var hitAge = frameCount - player.hitFrame
    if (hitAge < 0 || hitAge >= updatesPerSecond) return
    var blotCount = Math.max(1, 10 - Math.floor(hitAge / 7))
    var bloodColor = hitAge < 18 ? "red" : hitAge < 42 ? "darkred" : "maroon"
    for (var blot = 0; blot < blotCount; blot++) {
        var blotX = (blot * 97 + 23) % totalWidth
        var blotSize = 16 + (blot * 11) % 32
        var topY = (blot * 31) % 34
        var bottomY = totalHeight - 34 - (blot * 23) % 34
        rectangle(blotX, topY, blotSize, 10 + blotSize / 3, bloodColor)
        rectangle(blotX + 4, topY + 8, Math.max(4, blotSize / 2), 18 + blot * 2, "darkred")
        rectangle(blotX, bottomY, blotSize, 10 + blotSize / 3, bloodColor)
        rectangle(blotX + 4, bottomY - 14, Math.max(4, blotSize / 2), 18 + blot, "darkred")
    }
}

// Huvudloop: körs en gång per bildruta och sköter ritning, rörelse och spelregler.
function update() {
    // Uppdatera tiden och måla om bakgrunden med skräckstämningens bildeffekter.
    frameCount += 1
    rectangle(0, 0, totalWidth, totalHeight, "black")
    drawAtmosphere(Math.abs(scene.y))

    // Frys spelet efter dödsögonblicket medan skräckbilden spelas upp.
    if (gameOver) {
        drawDeathScreen()
        if (frameCount - deathFrame >= updatesPerSecond * 4) {
            stopUpdate()
        }
        return
    }

    // Segerbilden stannar kvar efter finalbossens död utan att fiender kan fortsätta anfalla.
    if (victory) {
        drawVictoryScreen()
        if (frameCount - victoryFrame >= updatesPerSecond * 8) {
            stopUpdate()
        }
        return
    }

    var currentScene = getCurrentScene()
    // Spelets bakgrundsmelodi följer djupet och pausas när dödsskärmen börjar.
    playBackgroundMusic(Math.abs(scene.y), currentScene.boss && currentScene.boss.type === 3)

    if (currentScene.bossLevel) {
        drawBossArena(currentScene.boss.type)
    }
    drawRoadBarrier()
    drawBlood(currentScene)

    // Rita gräs, jord, stenar och vissna plantor innan större föremål läggs ovanpå.
    for (var foliageIndex = 0; foliageIndex < currentScene.foliage.length; foliageIndex++) {
        drawFoliage(currentScene.foliage[foliageIndex])
    }

    // Rita skogens grupperade träd ovanpå markdetaljerna.
    for (var i = 0; i < currentScene.trees.length; i++) {
        drawTree(currentScene.trees[i].x, currentScene.trees[i].y, currentScene.trees[i].type)
    }

    // Rita slumpmässigt placerade byggnader i scenen.
    for (var buildingIndex = 0; buildingIndex < currentScene.buildings.length; buildingIndex++) {
        var building = currentScene.buildings[buildingIndex]
        drawBuilding(building.x, building.y, building.type)
    }
    // Stängslet ritas framför terrängen längs världens västra och östra yttergräns.
    drawLevelFence()

    // Rita huset och fyll på ammunition när spelaren går fram till lådan.
    if (currentScene.house) {
        drawHouse(currentScene.house.x, currentScene.house.y, currentScene.house.type)
        if (currentScene.house.ammo) {
            drawAmmoBox(currentScene.house.x, currentScene.house.y + 18)
            // Ett kort avstånd fungerar som upptagningsradie runt ammunitionslådan.
            if (distanceBetween(player.x, player.y, currentScene.house.x, currentScene.house.y + 18) < 30) {
                restockAllAmmo()
                currentScene.house.ammo = false
                playSound("ammo")
            }
        }
    }

    // Rita varje vapen som hittats i scenen och plocka upp det när spelaren går nära.
    for (var pickupIndex = currentScene.weapons.length - 1; pickupIndex >= 0; pickupIndex--) {
        var pickup = currentScene.weapons[pickupIndex]
        rectangle(pickup.x - 36, pickup.y - 30, 72, 54, "dimgray")
        rectangle(pickup.x - 32, pickup.y - 26, 64, 46, "black")
        var pickupColor = pickup.type === "rocket" || pickup.type === "flame" ? "orange" : pickup.type === "smg" || pickup.type === "rifle" ? "deepskyblue" : pickup.type === "shotgun" || pickup.type === "revolver" ? "gold" : "white"
        text(pickup.x - 28, pickup.y - 27, 12, weaponName(pickup.type).toUpperCase(), pickupColor)
        if (pickup.type === "rocket") {
            drawRocketLauncher(pickup.x, pickup.y)
        } else if (pickup.type === "smg") {
            drawSMG(pickup.x, pickup.y)
        } else if (pickup.type === "shotgun") {
            drawShotgun(pickup.x, pickup.y)
        } else if (pickup.type === "revolver") {
            drawRevolver(pickup.x, pickup.y)
        } else if (pickup.type === "rifle") {
            drawRifle(pickup.x, pickup.y)
        } else if (pickup.type === "flame") {
            drawFlamethrower(pickup.x, pickup.y)
        } else {
            drawPistol(pickup.x, pickup.y)
        }
        if (distanceBetween(player.x, player.y, pickup.x, pickup.y) < 25) {
            player.weapon = pickup.type
            addAmmo(player.weapon, ammoPickupAmount(player.weapon, false))
            player.ammo = ammoForWeapon(player.weapon)
            currentScene.weapons.splice(pickupIndex, 1)
            playSound("pickup")
        }
    }

    // Q byter till nästa vapen som har skott kvar.
    var switchIsDown = keyboard.q
    if (switchIsDown && !weaponSwitchWasDown) cycleWeapon()
    weaponSwitchWasDown = switchIsDown
    var hotbarWeapons = ["pistol", "revolver", "shotgun", "smg", "rifle", "flame", "rocket"]
    if (pendingHotbarSelection >= 0) {
        selectWeapon(hotbarWeapons[pendingHotbarSelection])
        pendingHotbarSelection = -1
    }

    // WASD väljer rörelseriktning och uppdaterar vart karaktären och vapnet är vända.
    var moveX = (keyboard.d ? 1 : 0) - (keyboard.a ? 1 : 0)
    var moveY = (keyboard.s ? 1 : 0) - (keyboard.w ? 1 : 0)
    var isMoving = moveX !== 0 || moveY !== 0

    if (isMoving) {
        // Dela varje rörelsekomponent med längden så riktningen blir en enhetsvektor.
        var moveLength = Math.sqrt(moveX * moveX + moveY * moveY)
        aimX = moveX / moveLength
        aimY = moveY / moveLength

        // Välj riktning efter den axel som har störst rörelse; vid diagonal gång behålls rimlig riktning.
        if (Math.abs(moveX) > Math.abs(moveY)) {
            player.facing = moveX < 0 ? "left" : "right"
        } else if (Math.abs(moveY) > Math.abs(moveX)) {
            player.facing = moveY < 0 ? "up" : "down"
        } else if (player.facing === "left" && moveX < 0 || player.facing === "right" && moveX > 0) {
            player.facing = moveX < 0 ? "left" : "right"
        } else {
            player.facing = moveY < 0 ? "up" : "down"
        }
    }

    // När uthålligheten tar slut måste den återhämta sig till hälften innan sprinten låses upp.
    var isSprinting = keyboard.shift && isMoving && !player.sprintLocked && player.stamina > 0
    var movementSpeed = isSprinting ? player.sprintSpeed : player.speed
    // Ljud spelas bara vid övergången från vanlig gång till sprint.
    if (isSprinting && !wasSprinting) {
        playSound("sprint")
    }
    wasSprinting = isSprinting
    if (isMoving && frameCount - lastFootstepFrame >= (isSprinting ? 10 : 20)) {
        playSound("footstep")
        lastFootstepFrame = frameCount
    }
    if (isSprinting) {
        // Stamina begränsas till 0–100 och tömning låser sprint tills halva nivån återställts.
        player.stamina = Math.max(0, player.stamina - 0.8)
        if (player.stamina === 0) {
            player.sprintLocked = true
            playSound("staminaEmpty")
        }
    } else {
        player.stamina = Math.min(player.maxStamina, player.stamina + 0.35)
        if (player.sprintLocked && player.stamina >= player.maxStamina / 2) {
            player.sprintLocked = false
        }
    }

    // Samma hastighet används i alla riktningar, även när spelaren går diagonalt.
    if (isMoving) {
        // Multiplicera den normaliserade riktningen med farten för att få förflyttning per bildruta.
        var speedX = moveX / moveLength * movementSpeed
        var speedY = moveY / moveLength * movementSpeed
        player.x += speedX
        player.y += speedY
    }

    // Den långa vägbarriären stoppar spelaren från att gå ut på vägen.
    if (scene.y === 0 && player.y < 170) {
        player.y = 170
    }

    // Världen slutar vid x = -5 och x = 5; håll spelaren innanför metallstängslet.
    if (scene.x === 5 && player.x > totalWidth - 42) {
        player.x = totalWidth - 42
    }
    if (scene.x === -5 && player.x < 42) {
        player.x = 42
    }

    // Byt scen när spelaren passerar en fri kant och rensa projektiler från förra scenen.
    if (player.x > totalWidth) {
        player.x = 0
        scene.x += 1
        bullets = []
        playSound("scene")
    }
    if (player.x < 0) {
        player.x = totalWidth - 1
        scene.x -= 1
        bullets = []
        playSound("scene")
    }
    if (player.y < 0 && scene.y > 0) {
        player.y = playfieldBottom() - player.size
        scene.y -= 1
        bullets = []
        playSound("scene")
    } else if (player.y < 0) {
        player.y = 1
    }
    if (player.y + player.size > playfieldBottom() && scene.y < 20) {
        player.y = player.size
        scene.y += 1
        bullets = []
        playSound("scene")
    } else if (player.y + player.size > playfieldBottom()) {
        player.y = playfieldBottom() - player.size
    }

    // SMG och eldkastare kan skjuta automatiskt; övriga vapen skjuter ett skott per tryck.
    var spaceIsDown = keyboard.space
    // Begränsa automatvapen till en salva var några bildrutor så ammunitionen inte töms direkt.
    var automaticInterval = player.weapon === "flame" ? 4 : 6
    var isAutomaticWeapon = player.weapon === "smg" || player.weapon === "flame"
    var shouldFire = isAutomaticWeapon ? spaceIsDown && frameCount % automaticInterval === 0 : spaceIsDown && !spaceWasDown
    if (player.weapon && player.ammo > 0 && shouldFire) {
        var firingWeapon = player.weapon
        playSound(firingWeapon)
        // Hagelgeväret sprider fem skott; eldkastaren skjuter en kort stråle av eld.
        var shotCount = player.weapon === "shotgun" ? 5 : 1
        // Vinkel beräknas från den sparade siktvektorn.
        var aimAngle = Math.atan2(aimY, aimX)
        for (var shot = 0; shot < shotCount; shot++) {
            // Hagel får fem närliggande vinklar; övriga projektiler går rakt.
            var spread = shotCount === 1 ? 0 : (shot - 2) * 0.16
            var shotAngle = aimAngle + spread
            // Gevär är snabba och precisa; raketer är långsamma och eld når bara en kort bit.
            var projectileSpeed = firingWeapon === "rocket" ? 7 : firingWeapon === "rifle" ? 13 : firingWeapon === "flame" ? 6 : 10
            bullets.push({
                x: player.x + Math.cos(shotAngle) * 24,
                y: player.y + Math.sin(shotAngle) * 24,
                speedX: Math.cos(shotAngle) * projectileSpeed,
                speedY: Math.sin(shotAngle) * projectileSpeed,
                damage: firingWeapon === "rocket" ? 8 : firingWeapon === "shotgun" || firingWeapon === "revolver" ? 2 : firingWeapon === "rifle" ? 3 : firingWeapon === "flame" ? 2 : 1,
                weapon: firingWeapon,
                // Räckvidden används senare för att ta bort skott som färdats långt.
                distance: 0
            })
        }
        // Varje avfyrning använder en patron, oavsett antal hagelgevärspellets.
        player.ammo -= 1
        // Uppdatera rätt vapenförråd efter varje skott.
        setWeaponAmmo(firingWeapon, player.ammo)
        if (player.ammo === 0) {
            switchToAvailableWeapon()
        }
    }
    // Nästa bildruta jämförs med detta värde för att upptäcka när mellanslag släppts.
    spaceWasDown = spaceIsDown

    // Flytta och rita projektilerna, upptäck träffar och ta bort skott som försvinner.
    for (var bulletIndex = bullets.length - 1; bulletIndex >= 0; bulletIndex--) {
        var bullet = bullets[bulletIndex]
        // Hastighetskomponenterna flyttar projektilen; distansen ökas för räckviddskontrollen.
        bullet.x += bullet.speedX
        bullet.y += bullet.speedY
        bullet.distance += 10
        if (bullet.weapon === "rocket") {
            rectangle(bullet.x - 7, bullet.y - 5, 14, 10, "orange")
            rectangle(bullet.x - 3, bullet.y - 3, 8, 6, "yellow")
        } else if (bullet.weapon === "flame") {
            rectangle(bullet.x - 9, bullet.y - 8, 18, 16, "darkred")
            rectangle(bullet.x - 6, bullet.y - 5, 12, 10, "orange")
            rectangle(bullet.x - 3, bullet.y - 3, 6, 6, "yellow")
        } else if (bullet.weapon === "rifle" || bullet.weapon === "revolver") {
            rectangle(bullet.x - 5, bullet.y - 3, 10, 6, bullet.weapon === "rifle" ? "deepskyblue" : "gold")
        } else {
            rectangle(bullet.x - 3, bullet.y - 3, 7, 7, "yellow")
            rectangle(bullet.x - 1, bullet.y - 1, 3, 3, "orange")
        }

        var hitEnemy = -1
        var enemyHitRadius = bullet.weapon === "flame" ? 30 : 14
        // Leta efter en fiende inom träffradien och spara dess index i fiendelistan.
        for (var enemyIndex = 0; enemyIndex < currentScene.enemies.length; enemyIndex++) {
            var target = currentScene.enemies[enemyIndex]
            if (distanceBetween(bullet.x, bullet.y, target.x, target.y - 8) < enemyHitRadius) {
                hitEnemy = enemyIndex
                break
            }
        }

        // Bossens kropp testas separat eftersom den inte ligger i listan med vanliga fiender.
        var bossHitRadius = currentScene.boss && currentScene.boss.type === 3 ? 92 : bullet.weapon === "flame" ? 55 : 38
        var hitBoss = currentScene.boss && currentScene.boss.hp > 0 &&
            distanceBetween(bullet.x, bullet.y, currentScene.boss.x, currentScene.boss.y - 15) < bossHitRadius

        if (hitEnemy >= 0) {
            if (bullet.weapon === "rocket") {
                // Raketen exploderar vid träff och skadar alla zombier nära smällen.
                playSound("explosion")
                rectangle(bullet.x - 40, bullet.y - 40, 80, 80, "darkred")
                rectangle(bullet.x - 25, bullet.y - 25, 50, 50, "orange")
                // Baklängesloop gör att borttagning ur arrayen inte hoppar över nästa zombie.
                for (var blastIndex = currentScene.enemies.length - 1; blastIndex >= 0; blastIndex--) {
                    var blastTarget = currentScene.enemies[blastIndex]
                    if (distanceBetween(bullet.x, bullet.y, blastTarget.x, blastTarget.y - 8) < 58) {
                        if (damageZombie(currentScene, blastTarget, bullet.damage)) {
                            currentScene.enemies.splice(blastIndex, 1)
                        }
                    }
                }
            } else {
                // Vanliga kulor och hagel skadar en zombie per projektil.
                var hitTarget = currentScene.enemies[hitEnemy]
                if (damageZombie(currentScene, hitTarget, bullet.damage)) {
                    // Ta bort besegrade zombier ur listan, annars fortsätter de jaga.
                    currentScene.enemies.splice(hitEnemy, 1)
                }
            }
            // Ett skott försvinner så fort det har träffat en fiende.
            bullets.splice(bulletIndex, 1)
        } else if (hitBoss) {
            if (bullet.weapon === "rocket") {
                // Raketexplosionen skadar både bossen och närliggande minioner.
                playSound("explosion")
                rectangle(bullet.x - 40, bullet.y - 40, 80, 80, "darkred")
                rectangle(bullet.x - 25, bullet.y - 25, 50, 50, "orange")
                damageBoss(currentScene, bullet.damage * 2)
                // Raketens stötvåg kan även skada småfiender runt bossen.
                for (var bossBlastIndex = currentScene.enemies.length - 1; bossBlastIndex >= 0; bossBlastIndex--) {
                    var bossBlastTarget = currentScene.enemies[bossBlastIndex]
                    if (distanceBetween(bullet.x, bullet.y, bossBlastTarget.x, bossBlastTarget.y - 8) < 58) {
                        if (damageZombie(currentScene, bossBlastTarget, bullet.damage)) {
                            currentScene.enemies.splice(bossBlastIndex, 1)
                        }
                    }
                }
            } else {
                damageBoss(currentScene, bullet.damage)
            }
            bullets.splice(bulletIndex, 1)
        // Ta bort missade skott efter 500 pixlar eller när de lämnar skärmens gränser.
        } else if (bullet.distance > (bullet.weapon === "flame" ? 125 : 500) || bullet.x < 0 || bullet.x > totalWidth || bullet.y < 0 || bullet.y > totalHeight) {
            bullets.splice(bulletIndex, 1)
        }
    }

    // Uppdatera gröna fiendeskott som skickats mot spelaren.
    for (var enemyShotIndex = currentScene.enemyShots.length - 1; enemyShotIndex >= 0; enemyShotIndex--) {
        var enemyShot = currentScene.enemyShots[enemyShotIndex]
        enemyShot.x += enemyShot.speedX
        enemyShot.y += enemyShot.speedY
        enemyShot.distance += 1
        rectangle(enemyShot.x - 6, enemyShot.y - 6, 12, 12, "darkred")
        rectangle(enemyShot.x - 3, enemyShot.y - 3, 6, 6, enemyShot.color)
        if (distanceBetween(player.x, player.y, enemyShot.x, enemyShot.y) < player.size + 6) {
            loseLife(currentScene)
            currentScene.enemyShots.splice(enemyShotIndex, 1)
        } else if (enemyShot.distance > 600 || enemyShot.x < 0 || enemyShot.x > totalWidth || enemyShot.y < 0 || enemyShot.y > totalHeight) {
            currentScene.enemyShots.splice(enemyShotIndex, 1)
        }
    }

    // Rita spelaren framför scenens objekt.
    drawPlayer()

    // Rita zombier, låt dem jaga spelaren och avsluta spelet vid kontakt.
    for (var k = 0; k < currentScene.enemies.length; k++) {
        var enemy = currentScene.enemies[k]
        drawEnemy(enemy)

        // Ändra x och y var för sig så zombien stegvis rör sig mot spelarens position.
        if (enemy.x < player.x) enemy.x += enemy.speed
        if (enemy.x > player.x) enemy.x -= enemy.speed
        if (enemy.y < player.y) enemy.y += enemy.speed
        if (enemy.y > player.y) enemy.y -= enemy.speed

        // Spottaren försöker hålla avstånd och skjuter en giftprojektil med några sekunders mellanrum.
        if (enemy.type === 7) {
            var spitterDistance = distanceBetween(enemy.x, enemy.y, player.x, player.y)
            if (spitterDistance < 190) {
                if (enemy.x < player.x) enemy.x -= enemy.speed * 1.5
                if (enemy.x > player.x) enemy.x += enemy.speed * 1.5
                if (enemy.y < player.y) enemy.y -= enemy.speed * 1.5
                if (enemy.y > player.y) enemy.y += enemy.speed * 1.5
            }
            if (frameCount >= enemy.nextShotFrame) {
                addEnemyShot(currentScene, enemy.x, enemy.y - 10, player.x, player.y, 3, 1, 0, "lime")
                enemy.nextShotFrame = frameCount + updatesPerSecond * 4
            }
        }

        enemy.y = Math.min(enemy.y, playfieldBottom() - 24)
        if (distanceBetween(player.x, player.y, enemy.x, enemy.y - 8) < player.size + 8) {
            loseLife(currentScene)
        }
    }

    // Bossarna har egna angrepp; finalbossen växlar mellan marksprängning och projektilsalva.
    if (currentScene.boss && currentScene.boss.hp > 0) {
        var boss = currentScene.boss
        var bossEnraged = boss.hp <= boss.maxHp / 2

        if (boss.type === 0) {
            if (!boss.isDashing && !boss.warningPlayed && boss.nextDashFrame - frameCount <= updatesPerSecond) {
                // Varningsljudet spelas en gång när det återstår högst en sekund.
                playSound("bossWarning")
                boss.warningPlayed = true
            }
            if (!boss.isDashing && frameCount >= boss.nextDashFrame) {
                // Normalisera riktningen mot spelaren för att få en jämn dash oavsett avstånd.
                var dashDX = player.x - boss.x
                var dashDY = player.y - boss.y
                var dashLength = Math.sqrt(dashDX * dashDX + dashDY * dashDY) || 1
                boss.dashX = dashDX / dashLength
                boss.dashY = dashDY / dashLength
                boss.isDashing = true
                boss.dashEndFrame = frameCount + Math.floor(updatesPerSecond * 1.1)
                boss.nextDashFrame = frameCount + updatesPerSecond * (bossEnraged ? 4 : 6)
                boss.warningPlayed = false
                playSound("bossDash")
            }
        } else if (boss.type === 1) {
            // Giftspottern varnar före skottet; i andra fasen skjuter den en salva.
            if (!boss.warningPlayed && boss.nextShotFrame - frameCount <= updatesPerSecond) {
                playSound("bossWarning")
                boss.warningPlayed = true
            }
            if (frameCount >= boss.nextShotFrame) {
                var shotSpread = bossEnraged ? 0.18 : 0
                var shotCount = bossEnraged ? 3 : 1
                for (var bossShot = 0; bossShot < shotCount; bossShot++) {
                    var spread = shotCount === 1 ? 0 : (bossShot - 1) * shotSpread
                    addEnemyShot(currentScene, boss.x, boss.y - 12, player.x, player.y, 3.5, 1, spread, "orange")
                }
                boss.nextShotFrame = frameCount + updatesPerSecond * (bossEnraged ? 3 : 4)
                boss.warningPlayed = false
                playSound("bossDash")
            }
        } else if (boss.type === 2) {
            // Markslagarens attackplats låses in under varningen så spelaren hinner flytta sig.
            var slamWarningDuration = Math.floor(updatesPerSecond * 1.4)
            if (boss.warningStartFrame === 0 && boss.nextDashFrame - frameCount <= slamWarningDuration) {
                boss.warningStartFrame = frameCount
                boss.attackX = player.x
                boss.attackY = player.y
                boss.slamHit = false
                playSound("bossWarning")
            }
            if (boss.warningStartFrame > 0 && !boss.slamHit) {
                var warningSize = 52 + Math.floor((frameCount - boss.warningStartFrame) / 3) % 24
                rectangle(boss.attackX - warningSize, boss.attackY - warningSize, warningSize * 2, 5, "orange")
                rectangle(boss.attackX - warningSize, boss.attackY + warningSize - 5, warningSize * 2, 5, "orange")
                rectangle(boss.attackX - warningSize, boss.attackY - warningSize, 5, warningSize * 2, "orange")
                rectangle(boss.attackX + warningSize - 5, boss.attackY - warningSize, 5, warningSize * 2, "orange")
            }
            if (frameCount >= boss.nextDashFrame && !boss.slamHit) {
                playSound("explosion")
                rectangle(boss.attackX - 72, boss.attackY - 72, 144, 144, "darkred")
                rectangle(boss.attackX - 48, boss.attackY - 48, 96, 96, "orange")
                if (distanceBetween(player.x, player.y, boss.attackX, boss.attackY) < 78 && !gameOver) {
                    loseLife(currentScene)
                }
                boss.slamHit = true
                boss.warningStartFrame = 0
                boss.nextDashFrame = frameCount + updatesPerSecond * (bossEnraged ? 3.5 : 5)
            }
        } else {
            // Finalbossen växlar mellan en stor markerad smäll och en bred salva av eld.
            if (!boss.warningPlayed && boss.nextShotFrame - frameCount <= updatesPerSecond) {
                playSound("bossWarning")
                boss.warningPlayed = true
            }
            if (frameCount >= boss.nextShotFrame) {
                var finalShotCount = bossEnraged ? 7 : 5
                for (var finalShot = 0; finalShot < finalShotCount; finalShot++) {
                    var finalSpread = (finalShot - (finalShotCount - 1) / 2) * (bossEnraged ? 0.16 : 0.12)
                    addEnemyShot(currentScene, boss.x, boss.y - 20, player.x, player.y, 4, 1, finalSpread, "orange")
                }
                boss.nextShotFrame = frameCount + updatesPerSecond * (bossEnraged ? 2.5 : 4)
                boss.warningPlayed = false
                playSound("bossDash")
            }

            var finalSlamWarning = Math.floor(updatesPerSecond * 1.8)
            if (boss.warningStartFrame === 0 && boss.nextDashFrame - frameCount <= finalSlamWarning) {
                boss.warningStartFrame = frameCount
                boss.attackX = player.x
                boss.attackY = player.y
                boss.slamHit = false
                playSound("bossWarning")
            }
            if (boss.warningStartFrame > 0 && !boss.slamHit) {
                var finalWarningSize = 74 + Math.floor((frameCount - boss.warningStartFrame) / 3) % 28
                rectangle(boss.attackX - finalWarningSize, boss.attackY - finalWarningSize, finalWarningSize * 2, 6, "orange")
                rectangle(boss.attackX - finalWarningSize, boss.attackY + finalWarningSize - 6, finalWarningSize * 2, 6, "orange")
                rectangle(boss.attackX - finalWarningSize, boss.attackY - finalWarningSize, 6, finalWarningSize * 2, "orange")
                rectangle(boss.attackX + finalWarningSize - 6, boss.attackY - finalWarningSize, 6, finalWarningSize * 2, "orange")
            }
            if (frameCount >= boss.nextDashFrame && !boss.slamHit) {
                playSound("explosion")
                rectangle(boss.attackX - 120, boss.attackY - 120, 240, 240, "darkred")
                rectangle(boss.attackX - 82, boss.attackY - 82, 164, 164, "orange")
                if (distanceBetween(player.x, player.y, boss.attackX, boss.attackY) < 125 && !gameOver) {
                    loseLife(currentScene)
                }
                boss.slamHit = true
                boss.warningStartFrame = 0
                boss.nextDashFrame = frameCount + updatesPerSecond * (bossEnraged ? 3 : 5)
            }
        }

        drawBoss(boss)
        if (boss.type === 0 && boss.isDashing) {
            // Under dash används den låsta riktningen; därefter återgår bossen till långsam jakt.
            boss.x += boss.dashX * 10
            boss.y += boss.dashY * 10
            if (frameCount >= boss.dashEndFrame) {
                boss.isDashing = false
            }
        } else {
            var bossDistance = distanceBetween(boss.x, boss.y, player.x, player.y)
            var chaseSpeed = boss.type === 2 ? 0.4 : boss.type === 3 ? (bossEnraged ? 0.65 : 0.42) : bossEnraged ? 0.8 : 0.55
            if (boss.type === 1 && bossDistance < 180) chaseSpeed = -0.5
            else if (boss.type === 1 && bossDistance < 300) chaseSpeed = 0
            if (boss.x < player.x) boss.x += chaseSpeed
            if (boss.x > player.x) boss.x -= chaseSpeed
            if (boss.y < player.y) boss.y += chaseSpeed
            if (boss.y > player.y) boss.y -= chaseSpeed
        }

        boss.y = Math.min(boss.y, playfieldBottom() - (boss.type === 3 ? 92 : 40))
        var bossTouchRadius = boss.type === 3 ? 64 : 24
        if (distanceBetween(player.x, player.y, boss.x, boss.y - 8) < player.size + bossTouchRadius) {
            loseLife(currentScene)
        }
    }

    // Statusrad och besökta nivåer samlas längst ned i en Doom-inspirerad panel.
    drawScreenFlicker()
    if (currentScene.boss && currentScene.boss.hp > 0) {
        // Omvandla återstående bildrutor till sekunder för bossens nedräkning.
        var bossTimerFrame = currentScene.boss.type === 1 ? currentScene.boss.nextShotFrame : currentScene.boss.nextDashFrame
        var bossTimer = Math.max(0, Math.ceil((bossTimerFrame - frameCount) / updatesPerSecond))
        var bossStatus = currentScene.boss.type === 1 ? "GIFT OM: " + bossTimer + " SEK" : currentScene.boss.type === 2 ? "MARKSLAG OM: " + bossTimer + " SEK" : currentScene.boss.type === 3 ? "ATTACK OM: " + bossTimer + " SEK" : currentScene.boss.isDashing ? "BOSS DASHAR!" : "DASH OM: " + bossTimer + " SEK"
        text(totalWidth - 190, 35, 18, bossName(currentScene.boss.type), currentScene.boss.type === 3 ? "orange" : "red")
        text(totalWidth - 190, 57, 16, bossStatus, "orange")
    }
    drawHitOverlay()
    drawDoomHud()

}
  </script>
</body>
